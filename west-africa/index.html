<title>West Africa Study Game</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(165deg,#8c3d16 0%,#e0a045 46%,#2f6b4a 100%);background-attachment:fixed;min-height:100vh;color:#1d1b3a}
#app{max-width:760px;margin:0 auto;padding:10px 12px 40px}
.top{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.top .logo{font-size:26px}
.top .who{flex:1;min-width:0}
.top .lvl{font-weight:800;font-size:15px}
.bar{height:12px;background:#e3e0ff;border-radius:8px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff9f1c,#ff3d81);border-radius:8px;transition:width .4s}
.tbtn{border:0;background:#efeaff;border-radius:12px;padding:8px 10px;font-size:18px;cursor:pointer}
h1{color:#fff;text-align:center;margin:16px 0 4px;font-size:28px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.sub{color:#fff;text-align:center;margin:0 0 12px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 12px}
.chip{border:0;border-radius:20px;padding:8px 14px;font-weight:800;background:rgba(255,255,255,.35);color:#fff;cursor:pointer;font-size:14px}
.chip.on{background:#fff;color:#9a3412;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.mode{border:0;border-radius:20px;padding:14px 8px;color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.22);text-align:center;min-height:104px;transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.mode .e{display:block;font-size:32px;margin-bottom:4px}
.mode small{display:block;font-weight:600;font-size:12px;opacity:.95;margin-top:2px}
.c1{background:#ff3d81}.c2{background:#ff9f1c}.c3{background:#7c4dff}.c4{background:#00b894}.c5{background:#0984e3}.c6{background:#e17055}.c7{background:#d63031}.c8{background:#6c5ce7}.c9{background:#00a8a8}
.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.card h2{margin:0 0 8px;font-size:20px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:#f4f1ff;border-radius:14px;padding:8px;text-align:center}
.stat b{display:block;font-size:22px;color:#9a3412}
.stat span{font-size:12px;font-weight:700}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:800;color:#fff;background:#9a3412;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(2px)}
.btn.g{background:#00b894}.btn.r{background:#ff3d81}.btn.o{background:#ff9f1c}.btn.w{background:#eee;color:#333}
.btn[disabled]{opacity:.45}
.hud{display:flex;gap:8px;align-items:center;color:#fff;font-weight:800;margin:10px 0}
.hud .sp{flex:1}
.hud .pill{background:rgba(0,0,0,.25);border-radius:14px;padding:6px 10px}
.q{font-size:20px;font-weight:800;line-height:1.3}
.q small{display:block;font-size:13px;color:#6b64a8;margin-bottom:4px}
.ch{display:block;width:100%;text-align:left;border:3px solid #e3e0ff;background:#fff;border-radius:14px;padding:12px;margin:8px 0;font-size:16px;font-weight:700;cursor:pointer;color:#1d1b3a}
.ch:active{background:#f4f1ff}
.ch.ok{background:#c9f7e2;border-color:#00b894}
.ch.bad{background:#ffd6e3;border-color:#ff3d81}
.ch[disabled]{cursor:default}
.fb{margin-top:10px;padding:10px;border-radius:12px;font-weight:700}
.fb.ok{background:#c9f7e2}.fb.bad{background:#ffe0e9}
.flash{perspective:900px;margin:12px 0}
.fc{min-height:230px;border-radius:22px;padding:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);background:linear-gradient(135deg,#ffd166,#ff9f1c);color:#3a2300;animation:pop .25s}
.fc.back{background:linear-gradient(135deg,#a0f0d0,#00b894);color:#00332a;font-size:19px}
.fc small{display:block;font-size:13px;font-weight:700;margin-bottom:8px;opacity:.75}
@keyframes pop{from{transform:scale(.94);opacity:.5}to{transform:scale(1);opacity:1}}
.mgrid{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}
.mt{border:3px solid #e3e0ff;background:#fff;border-radius:12px;padding:10px 8px;font-weight:800;font-size:14px;cursor:pointer;text-align:left;color:#1d1b3a}
.mt.sel{border-color:#7c4dff;background:#efeaff}
.mt.done{background:#c9f7e2;border-color:#00b894;opacity:.7}
.mt.wrong{animation:shake .35s;border-color:#ff3d81;background:#ffd6e3}
.mt.def{font-weight:600;font-size:13px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.steps{list-style:none;padding:0;margin:8px 0}
.steps li{background:#c9f7e2;border-radius:12px;padding:10px;margin:6px 0;font-weight:700}
.bank{display:flex;flex-direction:column;gap:6px}
.pill2{display:inline-block;background:#efeaff;border-radius:16px;padding:6px 12px;margin:3px;font-weight:700;font-size:14px}
.pill2.sel{background:#7c4dff;color:#fff}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.badge{background:#f4f1ff;border-radius:14px;padding:8px;text-align:center;font-size:12px;font-weight:700;opacity:.4;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;background:#fff3c4}
.badge b{display:block;font-size:26px}

["What does Lesson 11 say played a critical role in the growth of West African societies?","Trade","fact","geo",["p. 144"],["Only gold nuggets", "The rainforest", "Royal drums"],"Trade. The lesson says trade played a critical role in the growth and advancement of West African societies.",true],

["Who lived in the earliest farming communities, and about how many people were in one?","Extended families of about 15 to 20 people, including grandparents, aunts, uncles, and cousins.","fact","grow",["p. 145"],["Only two kings", "About 20,000 strangers", "Armies of 200,000"],"The earliest farming communities were extended families: grandparents, aunts, uncles, and cousins, about 15 to 20 people. They produced most of what they needed and worked together to clear fields, plant, and harvest.",true],
["Who likely made decisions for an early family community?","One of the male elders","fact","grow",["p. 145"],["A camel driver from North Africa", "The Nok blacksmiths", "Ibn Battuta"],"Very likely, one of the male elders made decisions for the family community.",true],
["What happened when family communities joined together?","They formed villages of about 100 to 200 people.","fact","grow",["p. 145"],["They all moved into the Sahara", "They became the Nok", "They stopped farming"],"Family-based communities joined to form villages that might contain one- to two-hundred people. The village leader was probably chosen for his wisdom and strength.",true],
["Why did extended families band together in villages?","To get help: for a flooding river, to mine iron or gold, and for protection.","fact","grow",["p. 146"],["To escape to the rainforest forever", "To stop all trade", "Because the Sahara had become a lake"],"Extended families banded together to get needed help. They might have to deal with a flooding river or mine iron or gold. They also banded together for protection.",true],
["What ruins were found at the village of Dhar Tichitt, and what do they suggest?","High walls and gates in present-day Mauritania. They suggest the villagers united to defend themselves.","fact","grow",["p. 146"],["A Roman coin factory", "Camels' watering places only", "The king's gold hitching post"],"Archaeologists found ruins of high walls and gates at Dhar Tichitt, in present-day Mauritania. These structures suggest that villagers united to defend themselves from outside attacks.",true],

["What did Nok furnaces burn, and what did blacksmiths do with the iron?","They burned huge amounts of charcoal. Blacksmiths hammered the red-hot iron into axes, hoes, and spears.","fact","grow",["p. 146"],["They burned gold dust and made only jewelry", "They used no fuel", "They carved iron with ivory"],"Smelting is melting ore to get metal. The Nok used enormous amounts of charcoal to fuel their furnaces. Blacksmiths hammered and bent the red-hot iron into axes, hoes, and weapons such as spears.",true],

["How many people lived in Jenne-jeno, and what was the wall like?","About 20,000 people. A wall 10 feet wide and 13 feet high.","fact","grow",["p. 147"],["About 15 people and no wall", "About 200,000 people and a wall of salt", "About 40 people and a wooden fence one foot high"],"Jenne-jeno grew into a busy city of about 20,000 people. It was surrounded by a wall 10 feet wide and 13 feet high. The wall may have been built to give the city more status and to control the coming and going of traders.",true],

["What crafts were practiced in Jenne-jeno?","Farming, fishing, pottery, metalwork, weaving, leatherwork, bead making, and ivory carving.","fact","grow",["p. 147"],["Only salt mining", "Only writing Arab histories", "Only herding in the Sahara"],"Besides farmers and fishers, there were potters, metalsmiths, weavers, leatherworkers, bead makers, and ivory carvers.",false],
["Why were blacksmiths the most respected people in Jenne-jeno?","People prized iron more than gold and thought blacksmiths had supernatural powers.","fact","grow",["p. 147"],["They owned every camel", "They were the only farmers", "They refused to make tools"],"West Africans prized iron more than gold. They were amazed that blacksmiths could make tools from iron. As in many early cultures, people thought blacksmiths had supernatural, or magical or godlike, powers. Blacksmiths could act as political leaders, judges, and doctors.",true],
["How close is ancient Jenne-jeno to the modern city of Jenne?","Less than two miles","fact","grow",["p. 147"],["600 miles", "On another continent", "Inside the Atlas Mountains"],"Jenne-jeno's location on the Niger was less than two miles from the modern city of Jenne.",false],

["When did the kingdom of Ghana last?","From sometime before 500 C.E. until its final collapse in the 1200s","fact","ghana",["p. 151"],["From 4000 B.C.E. until 1500 B.C.E.", "Only during the year 1352", "From the third century B.C.E. until 300 C.E."],"From sometime before 500 C.E. until its final collapse in the 1200s",true],

["What should you remember about the story of 200,000 warriors?","The number surely grew as the story was retold, but the king could call up a large army, including archers on foot.","fact","ghana",["p. 153"],["The book says the number is an exact count from a census", "The army had only 15 people", "Ghana had no soldiers"],"Stories describe a king who could call up 200,000 warriors. That number no doubt grew as the story was passed on, but the king certainly could summon a sizable army, including infantry archers.",false],
["What was the job of Ghana's elite soldiers?","They served the king as bodyguards, escorts, and military advisors.","fact","ghana",["p. 153"],["They kept the gold mines of Wangara secret", "They carried goods as porters only", "They wrote the Arab histories"],"Special groups were chosen for courage, honesty, and intelligence. These soldiers served as bodyguards, escorts, and military advisors.",false],
["What goods did traders from North Africa bring across the Sahara?","Salt, copper, and cowrie shells","fact","trade",["p. 154"],["Mahogany and teak logs only", "Only mud blocks", "Only Nok furnaces"],"Traders from North Africa crossed the Sahara with salt, copper, and cowrie shells, a type of seashell used as money.",true],
["What did those traders take from the southern forests?","Kola nuts, hides, leather goods, ivory, slaves, and gold","fact","trade",["p. 154"],["Only sand dunes", "Only royal drums", "Only camels from Turkey"],"Merchants traded their goods for kola nuts, hides, leather goods, ivory, slaves, and gold from the southern part of West Africa. Then they carried those goods back to markets in North Africa.",true],
["Why did Ghana's location make it rich?","Traders going to and from the south had to pass through Ghana and pay heavy taxes each time.","fact","trade",["p. 154"],["Ghana was so far from every route that no trader came", "Ghana banned taxes", "Ghana had no markets"],"Ghana lay between North Africa and West Africa, so it could control trans-Saharan trade. Traders paid heavy taxes on their goods each time they passed through. Those taxes helped make Ghana rich.",true],
["How early did North Africans bring gold out of the southern forests?","As long ago as 400 to 500 B.C.E., though crossing the desert was especially hard then.","fact","trade",["p. 154"],["Not until 1352", "Only after 1600 C.E.", "Never"],"Trans-Saharan trade has a long history. Archaeologists have found evidence that North Africans brought gold back from the southern forests as long ago as 400 to 500 B.C.E. Travel across the Sahara was especially challenging for these early people.",false],
["What two changes helped trans-Saharan trade grow?","The introduction of the camel, and the spread of Islam","fact","trade",["p. 154"],["The end of the Niger River, and a ban on gold", "The invention of iron by the Nok only", "The wall around Jenne-jeno"],"The introduction of the camel, and the spread of Islam",true],
["Why could camels cross the Sahara?","A camel can drink up to 25 gallons at a time and then travel for several days. Double eyelashes and hairy ears help keep out the sand.","fact","trade",["p. 154"],["Camels needed a river under them the whole way", "Camels could not drink water", "Camels were used only as food and never for travel"],"Arab traders first brought camels to the Sahara around 300 C.E. A camel can drink up to 25 gallons of water at a time and travel several days without stopping. Double rows of eyelashes and hairy ear openings help keep out blowing sand.",true],
["What was happening to West African gold by the 4th century C.E.?","Large amounts were being made into Roman coins in North Africa. That gold likely came from West Africa.","fact","trade",["p. 154"],["It was all thrown away", "It was used only as roof tiles in Jenne-jeno", "It had not been discovered yet"],"Camels let traders open caravan routes. By the 4th century C.E., large amounts of gold were being made into Roman coins in North Africa. It is likely that gold came from West Africa.",false],
["What happened when Muslims invaded Ghana in the 7th century?","Ghana turned the invaders back, but many Muslims stayed, settled in towns, and became merchants.","fact","trade",["p. 154"],["Ghana disappeared that same year", "No Muslim ever entered West Africa", "The Nok left Nigeria"],"In the 7th century, Muslims invaded Ghana's empire. They wanted to convert West Africans to Islam and to control trade. Ghana turned back the invaders, but many Muslims settled in West African towns and became merchants. Trade kept expanding because of the spread of Islam.",true],
["What was true of Ghana's power by the year 1000?","Ghana dominated the trade routes between North Africa and West Africa, and the empire was near its height.","fact","trade",["p. 154"],["Ghana had not yet begun", "Ghana had already ended in 1203", "Ghana had left Africa"],"By the year 1000, Ghana's empire dominated the trade routes between North and West Africa. The empire reached its height around the year 1000.",true],
["Who crossed the Sahara in 1352, and why does his writing matter?","Ibn Battuta, a Muslim historian and traveler. His account describes what the traders' journeys were like.","fact","trade",["p. 155"],["A Nok blacksmith", "A Hittite king", "The son of Ghana's king in 4000 B.C.E."],"In 1352 Ibn Battuta crossed the Sahara with a trade caravan. He was a Muslim historian and traveler, and his account describes the journey.",false],
["Where did Battuta's caravan begin its desert crossing?","At Sijilmasa, an oasis city on the northern edge of the Sahara, in the foothills of the Atlas Mountains.","fact","trade",["p. 155"],["At Jenne-jeno", "At Dhar Tichitt", "In central Nigeria"],"The caravan started at the oasis city of Sijilmasa. Donkeys had carried goods from the Mediterranean coast, from Europe, Arabia, and Egypt, to Sijilmasa. Then camels took the goods south.",false],
["How did the caravan cross the desert day by day?","After the rains, they walked from oasis to oasis until afternoon, then rested until sunset.","fact","trade",["p. 155"],["They rode the Niger the whole way", "They walked only at noon with no stops", "They flew from city to city"],"They stayed in Sijilmasa until the rainy season ended, when watering places were full and there was grass for the animals. Each day the traders walked until the afternoon, when the sun was high, and then rested until sunset.",false],
["What danger does Battuta describe in the desert?","Caravans could get lost, and some traders died. Once his group killed camels and drank the water stored in the animals' stomachs.","fact","trade",["p. 155"],["The desert was too muddy to walk", "They were never short of water", "The only danger was too much rain"],"Walking across the Sahara was hard and dangerous. Caravans sometimes lost their way, and some traders died. During one stretch they could not find water, so they slaughtered some camels and drank the water stored in the animals' stomachs.",false],
["What did the caravan do at Taghaza and at Walata?","At Taghaza they loaded salt. At Walata they moved the goods from camels to donkeys and porters.","fact","trade",["p. 155"],["They built Jenne-jeno", "They turned around and went to Turkey", "They dumped the salt into the sea"],"On the way through the desert the caravan stopped at Taghaza, where the salt mines were, and took on a load of salt. At Walata, on the edge of the desert, they transferred the salt and other goods from camels to donkeys and to porters, people who carry goods for a living.",false],
["How long did the full trip to the markets near the Gulf of Guinea take?","About two months","fact","trade",["p. 155"],["About two hours", "About two days", "About 1,600 years"],"From Sijilmasa the routes stretched across the desert, through Ghana, south to the Gulf of Guinea, and east toward present-day Chad. The entire journey took about two months.",false],
["Why did people south of the desert crave salt?","They had no local salt. Hot climates make people sweat out salt, and they also used salt to preserve food, feed cattle, and season meals.","fact","trade",["p. 156"],["They already had more salt than they could use", "Salt was useless in a hot climate", "They used gold dust as their only food"],"Salt is important in the diet because people and animals lose salt when they sweat. People in hot West Africa had to replace it. They also needed salt to keep food from spoiling, to give to their cattle, and because they liked the taste. For many of them, salt was more precious than gold. They had little use for gold except as something to trade.",true],
["Where did West Africans get salt, and how was it produced?","From Taghaza and other places in the Sahara, by evaporating salty water or by mining blocks.","fact","trade",["p. 156"],["From the rainforest trees", "From the Niger's fish", "From gold nuggets"],"West Africans had no local source of salt, so they got it from Taghaza and other places in the Sahara. One method: water was poured into holes in salty earth, drew out the salt, and evaporated in the sun. The salt was packed into blocks. The other method was mining.",true],
["How was salt mined at Taghaza?","Workers enslaved by Arab merchants dug tunnels and cut the salt out in large blocks.","fact","trade",["p. 156"],["Salt fell from the rainforest", "Camels licked it off the sand with no digging", "The Nok smelted it from iron ore"],"At Taghaza, salt deposits were below the surface. Workers enslaved by Arab merchants reached the salt by digging tunnels, then cut it out in large blocks.",false],
["What were Taghaza's houses built from, and how did people there get food?","Houses were built of salt blocks. Little food grew there, so people depended on caravans for food such as dates and millet.","fact","trade",["p. 157"],["Houses were built of mahogany, and farms fed everyone", "Houses were gold, and no one needed food", "Houses were mud, and the Niger provided all the grain"],"Even the houses in Taghaza were built of salt blocks. Because no food was produced there, people relied on caravans to bring food, such as dates and millet. If the caravans did not arrive, the miners starved.",false],
["What salt tax did Ghana charge?","One-sixth of an ounce of gold on each load entering from the north, and one-third of an ounce on each load going south.","fact","trade",["p. 157"],["No tax at all", "One camel per load", "Half of every person in the caravan"],"Traders paid taxes on goods both when they entered Ghana and when they left. Ghana charged one-sixth of an ounce of gold for each load of salt that came in from the north, and one-third of an ounce of gold for each load taken south.",true],
["What did Ghana charge on copper and on general merchandise?","Five-eighths of an ounce of gold per load of copper, and a little more than one ounce of gold per load of general merchandise.","fact","trade",["p. 157"],["One grain of sand", "Nothing, because copper was free", "The same as a drink of water"],"For every load of copper, traders were charged five-eighths of an ounce of gold. They paid slightly more than one ounce of gold per load of general merchandise.",false],
["What did Ghana's tax money pay for?","It filled the treasury and helped pay for armies that protected the kingdom and the trade routes.","fact","trade",["p. 157"],["It was buried and never used", "It paid only for camel stomachs", "It was given to the Wangarans as a secret"],"The taxes enriched Ghana's treasury and helped pay for armies. Those armies protected the kingdom, let the king conquer other territory, and guarded trade routes against raiders who might rob the caravans.",true],
["How did the Wangarans protect the secret of their gold mines?","Miners would die rather than tell. One story says they stopped trading for three years so no one could follow them home.","fact","trade",["p. 156"],["They printed maps for every trader", "They moved the mines to Sijilmasa", "They told every captured miner to draw a map"],"The Wangarans kept the location of their gold mines secret. Stories say merchants sometimes captured a miner and tried to force him to reveal Wangara. The miners would give their lives rather than tell. In one tale, after a miner was captured, the Wangarans stopped trading for three years so no one would discover the way to Wangara. To this day, no one knows for certain exactly where the mines were.",true],
["What was Kumbi's market like?","It was the busiest market in West Africa. People paid for goods, including enslaved people, with gold dust.","fact","trade",["p. 158"],["It was empty because trade was banned", "It sold only sand", "It accepted no gold"],"Caravans brought goods to the great market in Kumbi, then many went on to trade with the Wangarans. Ironsmiths sold weapons and tools, goldsmiths and coppersmiths sold jewelry, weavers sold cloth, and leatherworkers sold leather goods. Shoppers could also find blue blouses from Spain, robes from Morocco, cattle, sheep, honey, wheat, raisins, dried fruit, ivory, pearls, and slaves. All goods were paid for with gold dust.",false],
["What does the lesson say about Kumbi's slave market?","Kumbi had one of the largest slave markets in West Africa. Raiders captured people along the southern border. Arab merchants bought many of them and sold them north of the desert.","fact","trade",["p. 158"],["The book says Kumbi had no slave market", "Enslaved people were paid for with salt blocks only", "Only the Nok ran the market in the 500s B.C.E."],"Kumbi had one of the largest slave markets in West Africa. Raiders captured people along the southern border of Ghana. Many were bought at Kumbi by Arab merchants, who took them across the Sahara and sold them to North Africans or Europeans.",false],
["What goods did caravans lay out for the Wangarans?","Wool, silk, cotton, dates, figs, grains, leather, and salt","fact","trade",["p. 158"],["Only iron-smelting furnaces", "Only gold nuggets for the king", "Only dune sand"],"Trade with the Wangarans happened along a river in the southern forests. The caravans brought wool, silk, cotton, dates, figs, grains, leather, and salt.",false],
["How did silent barter work?","Traders laid out goods, beat a drum, and walked away. Wangarans came by boat, left gold dust, and left. The groups bargained without meeting.","fact","trade",["p. 158"],["They met in the king's court and shook hands", "They shouted prices across Kumbi", "They refused to use drums or gold"],"Traders spread their goods along the river, beat a drum to announce an offer, and walked several miles away. When the Wangarans heard the drum, they came by boat, put some gold dust next to the goods, beat a drum, and left. If the gold was enough, the traders took it. If not, they waited for the Wangarans to leave more. They bargained back and forth without ever meeting.",true],
["What were two advantages of silent barter?","People who spoke different languages could trade, and the Wangarans could hide where the gold mines were.","fact","trade",["p. 158"],["It made the mines easy to find, and it required one shared language", "It ended all trade", "It let the king take the gold without paying"],"Silent barter had two advantages. First, people who spoke different languages could trade. Second, it let the Wangarans protect the secret location of their gold mines.",true],
["What did the Almoravids do to Ghana?","In the second half of the 11th century they attacked the empire and captured Kumbi. The king won the city back, but the empire had already broken apart.","fact","ghana",["p. 159"],["They built Jenne-jeno in the third century B.C.E.", "They brought the first camels in 300 C.E.", "They were the Nok blacksmiths"],"Ghana reached its height around the year 1000. In the second half of the 11th century, Muslim warriors called the Almoravids began attacking and captured Kumbi. Ghana's king regained the capital, but the old empire had already broken apart.",true],
["How did the loss of trees and water weaken Ghana?","People cut trees for charcoal to smelt iron, and water became so scarce that farmers could not raise crops or keep flocks.","fact","ghana",["p. 159"],["The rivers flooded the Sahara and made too much food", "No one cut any trees", "Water became so plentiful that people left for fun"],"The loss of natural resources weakened Ghana further. A growing population put great stress on scarce resources such as trees and water. Trees were cut down to provide charcoal for iron-smelting furnaces. Water became so scarce that farmers could no longer grow crops or keep flocks. People left to search for better conditions.",true],
["When did Ghana's empire come to an end?","In 1203, when a rival kingdom conquered Kumbi","fact","ghana",["p. 159"],["In 4000 B.C.E.", "In the third century B.C.E.", "In 300 C.E."],"In 1203, when a rival kingdom conquered Kumbi",true],
["How did the empire of Mali begin?","Around 1240 the Mande conquered Kumbi. Their homeland was south of Kumbi, closer to the Niger.","fact","ghana",["p. 159"],["The Hittites founded it in 1500 B.C.E.", "Ibn Battuta founded it in 1352", "The Nok founded it in central Nigeria"],"Around 1240 a group of West Africans called the Mande conquered Kumbi. Their homeland of Mali was south of Kumbi, closer to the Niger River. They built an empire that reached from the Atlantic Ocean to beyond the Niger River, and from the southern forests to the salt and copper mines of the Sahara.",true],
["How was Mali's wealth like Ghana's?","Mali grew rich by controlling trade, especially gold. Its leaders had accepted Islam.","fact","ghana",["p. 159"],["Mali refused all trade and all gold", "Mali's wealth came only from dune sand", "Mali banned Islam and merchants"],"Like Ghana, Mali gained much of its wealth from control of trade, particularly gold. Its leaders had accepted Islam, and under their rule Islam became even more influential in West Africa.",true],
["What does the Lesson 12 summary say brought Ghana down?","Years of war and the loss of natural resources, in the 13th century","fact","ghana",["p. 159"],["A sudden end to the savanna rains in 4000 B.C.E.", "The discovery of Jenne-jeno", "A decision to stop taxing trade"],"The summary says years of war and the loss of natural resources led to Ghana's downfall in the 13th century. The next powerful West African empire, Mali, also built its wealth on trade.",true],
["What does Lesson 11's summary say about geography?","Geography was a major factor. Settlements flourished south of the Sahara, where people could farm, and rivers such as the Niger were trade routes.","fact","geo",["p. 149"],["Geography did not matter at all", "Everyone settled in the driest dunes", "Rivers were useless for trade"],"The summary says geography was a major factor in the development of West African societies. Settlements flourished south of the Sahara, where the land permitted farming. Communities traded for items they could not produce locally. Rivers such as the Niger served as trade routes.",true],
["What city does the caravan picture at the start of Lesson 11 show?","Timbuktu, a city in the early West African kingdom of Mali","fact","king",["p. 143"],["Taghaza", "Sijilmasa", "Dhar Tichitt"],"The caption says that behind the caravan is Timbuktu, a city in the early West African kingdom of Mali.",false],
["What was the horse-and-rider brass weight used for?","Trans-Saharan traders used it to weigh gold dust. The Ashanti people of Ghana made it.","fact","trade",["p. 154"],["It was a weapon for the Nok", "It was a hitching post", "It was a salt block"],"A brass weight shaped like a horse and rider was made by the Ashanti people of Ghana. Trans-Saharan traders used this artifact to weigh gold dust.",false],
["What did the map of early kingdoms say they all relied on?","Trans-Saharan trade, not only local trade. Gold was especially important to Mali, and Songhai also traded with distant lands.","fact","king",["p. 149"],["Only farming inside one village", "Only the rainforest, with no trade", "Only tribute from the Hittites"],"The great kingdoms did not rely only on local trade. By the time Ghana was a significant power, trans-Saharan trade was bringing new wealth from other regions, such as the present-day Middle East. Control of trade, particularly in West African gold, was also crucial to the power of Mali. Songhai, too, relied on trade with distant lands.",false],
["When did archaeologists begin excavating Jenne-jeno?","1977","fact","grow",["p. 147"],["1352","1203","4000 B.C.E."],"In 1977, archaeologists began excavating the ancient West African city of Jenne-jeno. Until that rediscovery, some historians believed cities did not exist in West Africa until outsiders arrived.",true],
["What did Ghana do with their military?","Elite soldiers were chosen for courage, honesty, and intelligence. Stories say the king could call up 200,000 warriors, but that number grew as it was retold.","fact","ghana",["p. 153"],["Ghana had no soldiers", "The army only mined salt at Taghaza", "Only Ibn Battuta served in the army"],"Ghana's military had a regular army, reserve forces, and elite soldiers. The regular army guarded the borders, put down small revolts, and kept order. Soldiers wore knee-length cotton pants, sleeveless tunics, sandals, and headdresses with feathers. Tunic color and the number of feathers showed rank. Weapons included spears, daggers, swords, battle clubs, and bows and arrows. Elite soldiers were chosen for courage, honesty, and intelligence, and served as bodyguards, escorts, and advisors. Every man had to train. Stories say one king could call up 200,000 warriors. The book says that number grew as the story was passed on, but he could summon a large army, including archers on foot. Armies also kept trade routes safe from raiders.",true],
["How did Ghana get rich?","By controlling and taxing trans-Saharan trade, especially gold from the south and salt passing through from the north.","fact","ghana",["p. 154"],["Ghana had lots of its own salt", "Good farmland in the Sahel made Ghana rich", "Ghana banned markets"],"Ghana got rich by controlling trans-Saharan trade, especially gold, and by taxing goods that passed through. Gold came from secret mines in the forests to the south, in Wangara. Salt came from the Sahara to the north, especially Taghaza. Ghana did not have its own salt. It charged one-sixth of an ounce of gold for each load of salt entering from the north, and one-third of an ounce for each load going south. The king kept gold nuggets and let ordinary people keep only gold dust. Ghana arose in the semidesert Sahel. The book does not say good farmland made Ghana rich. It says Ghana's location let it control the trade, and that wealth paid for a strong army.",true],
["What is special about Jenne-jeno?","Archaeologists began excavating it in 1977 and found a city from the third century B.C.E. People there prized iron more than gold, and blacksmiths were the most respected.","fact","grow",["p. 147"],["It was a salt mine in the Sahara", "Outsiders built it for the local people", "People there prized gold more than iron"],"Jenne-jeno is special because, in 1977, archaeologists began excavating it and showed that a West African city existed before outsiders arrived to build one. It was built in the third century B.C.E. where the Niger meets the Bani, lasted more than 1,600 years, and grew to about 20,000 people inside a wall 10 feet wide and 13 feet high. The people prized iron more than gold. Blacksmiths were the most respected people. Many thought blacksmiths had supernatural powers, and blacksmiths could act as political leaders, judges, and doctors.",true]

  SAM_SEQS.forEach(function(s,i){ items.push({id:'s'+(i+1), kind:'seq', title:s.title, steps:s.steps, topic:s.topic, src:s.src, hi:!!s.hi}); });
  SAM_SORT.forEach(function(s,i){ items.push({id:'b'+(i+1), kind:'sort', name:s[0], bucket:s[1], topic:'trade', src:s[2], note:s[3], hi:!!s[4]}); });
  items.push({id:'zones', kind:'five', topic:'geo', src:SAM_FIVE.src, right:SAM_FIVE.right, decoys:SAM_FIVE.decoys, hi:true});
  SAM_GOALS.forEach(function(g,i){ items.push({id:'g'+(i+1), kind:'goal', text:g[0], group:g[1], topic:'goal', src:g[2]}); });
  return items;
})();
if (typeof module !== 'undefined') { module.exports = {SAM_SRC:SAM_SRC, SAM_TOPICS:SAM_TOPICS, SAM_ITEMS:SAM_ITEMS, SAM_FIVE:SAM_FIVE, SAM_TIPS:SAM_TIPS, SAM_SEQS:SAM_SEQS, SAM_SORT:SAM_SORT}; }

/* ---------- audio ---------- */

/* ---------- helpers ---------- */

/* ---------- multiple choice builder ---------- */
function pre(s){return s.toLowerCase().replace(/[^a-z]/g,'').slice(0,4);}
function makeMC(it){
 if(it.kind==='pair'){
  var others=PAIRS.filter(function(p){return p.id!==it.id&&pre(p.term)!==pre(it.term);});
  var same=others.filter(function(p){return p.topic===it.topic;});
  var dis=pick(same,3);
  if(dis.length<3){dis=dis.concat(pick(others.filter(function(p){return dis.indexOf(p)<0;}),3-dis.length));}
  if(Math.random()<0.6){
   return {hint:'Which word matches?',text:it.def,choices:shuf([{t:it.term,ok:true}].concat(dis.map(function(p){return {t:p.term};}))),why:it.term+': '+it.def};
  }

 }
 if(it.kind==='fact'){
  var w=it.w.slice();
  if(w.length<3){
   var pool=[];ITEMS.forEach(function(f){if(f.kind==='fact'&&f.pool===it.pool&&f.a!==it.a&&pool.indexOf(f.a)<0)pool.push(f.a);});
   w=w.concat(pick(pool,3-w.length));
  }
  var th=SAM_TOPICS.filter(function(x){return x.id===it.topic;})[0];
  return {hint:th?th.name:'West Africa',text:it.q,choices:shuf([{t:it.a,ok:true}].concat(w.slice(0,3).map(function(x){return {t:x};}))),why:'Answer: '+it.a};
 }
 if(it.kind==='sort'){
  return {hint:'North or south of the Sahara trade?',text:'Where did traders get '+it.name+'?',choices:[{t:'North, across the Sahara',ok:it.bucket==='north'},{t:'South, in the forests of West Africa',ok:it.bucket==='south'}],why:it.note||it.name};
 }
 return null;
}

/* ---------- views ---------- */

}

function home(){

 var chips='<button class="chip'+(S.topic==='all'?' on':'')+'" data-t="all">All</button>'+SAM_TOPICS.map(function(x){return '<button class="chip'+(S.topic===x.id?' on':'')+'" data-t="'+x.id+'">'+x.emoji+' '+x.name+'</button>';}).join('');
 app.innerHTML=header()+
 '<h1>West Africa</h1><p class="sub">Lessons 11 and 12: early societies, Ghana, and the gold-salt trade.</p>'+
 '<div class="chips">'+chips+'</div>'+
 '<div class="grid">'+
 '<button class="mode c1" data-m="flash"><span class="e">\uD83C\uDCCF</span>Flashcards<small>Flip and learn</small></button>'+
 '<button class="mode c2" data-m="quiz"><span class="e">\u2753</span>Quiz<small>10 questions</small></button>'+
 '<button class="mode c3" data-m="match"><span class="e">\uD83E\uDDE9</span>Matching<small>Words and meanings</small></button>'+
 '<button class="mode c4" data-m="speed"><span class="e">\u23F1\uFE0F</span>Speed Round<small>60 seconds, streaks</small></button>'+
 '<button class="mode c5" data-m="sort"><span class="e">\u2696\uFE0F</span>North or South<small>Where did the goods come from?</small></button>'+
 '<button class="mode c6" data-m="order"><span class="e">\uD83D\uDCCB</span>Put in Order<small>Timelines and trade</small></button>'+
 '<button class="mode c7" data-m="zones"><span class="e">\uD83C\uDF3F</span>Four Zones<small>Sahara to forest</small></button>'+

 '<button class="mode" data-m="test" style="grid-column:1/-1;min-height:84px;background:#6d28d9"><span class="e">\u270D\uFE0F</span>Test Prep<small>3 short answers and 1 longer answer, like the real test</small></button>'+
 '<button class="mode c10" data-m="td" style="grid-column:1/-1;min-height:84px"><span class="e">\uD83D\uDC2B</span>Defend Kumbi<small>Answer questions, earn gold dust, stop the raiders'+(S.best.td?' (best: '+S.best.td+'/10 waves)':'')+'</small></button>'+
 '</div>'+
 '<div class="card"><h2>My Progress</h2><div class="row"><div class="stat"><b>'+m+'/'+t+'</b><span>Mastered</span></div><div class="stat"><b>'+S.bestStreak+'</b><span>Best streak</span></div><div class="stat"><b>'+S.best.speed+'</b><span>Best speed score</span></div><div class="stat"><b>'+S.days.length+'</b><span>Study days</span></div></div>'+

 '<p class="tl">An item is mastered when you get it right 2 times in a row. Highlighted ideas from the book come up more often in the quiz.</p></div>'+
 '<div class="card"><h2>Badges</h2><div class="badges">'+BADGES.map(function(b){return '<div class="badge'+(S.badges[b[0]]?' on':'')+'" title="'+esc(b[3])+'"><b>'+b[1]+'</b>'+esc(b[2])+'<br><span style="font-weight:500">'+esc(b[3])+'</span></div>';}).join('')+'</div></div>'+
 '<p class="sub"><a href="../" style="color:#fff;font-weight:800">Science lab game</a></p>'+
 '<p class="sub"><button class="back" id="reset">Reset my progress</button></p>';
 bindHeader();

}
function pickWeighted(list,n){
 var hi=shuf(list.filter(function(i){return i.hi;})), lo=shuf(list.filter(function(i){return !i.hi;}));

 return shuf(out).slice(0, Math.min(n, list.length));
}
function go(m){
 if(m==='flash')return flashcards(filtered(['pair','fact','sort','five','seq','lookup']),'Flashcards');

/* ---------- flashcards ---------- */
function flashcards(list,title){
 if(!list.length)return empty(title,'No cards for this topic. Try another topic.');
 var q=shuf(list),i=0,back=false;
 function face(it){
  if(it.kind==='pair')return ['Word',it.term,'Meaning',it.def];
  if(it.kind==='fact')return ['Question',it.q,'Answer',it.fa||it.a];
  if(it.kind==='sort')return ['Where did this trade good come from?',it.name,'Answer',(it.bucket==='north'?'From north of the Sahara. ':'From the southern forests of West Africa. ')+(it.note||'')];
  if(it.kind==='seq')return ['Put in order',it.title,'Steps',it.steps.map(function(s,k){return (k+1)+'. '+s;}).join('<br>')];
  if(it.kind==='five')return ['Name them','The 4 vegetation zones of West Africa','Answer',it.right.join(', ')];
  if(it.kind==='lookup')return ['On the study guide word list',it.term,'Note','This word is on the vocabulary list, but its meaning is not given in the study materials. Look it up in your notebook or textbook.'];
  return ['','',' ',''];
 }
 function draw(){
  if(i>=q.length){addXP(10);return shell(title,'<div class="card"><div class="big">\uD83C\uDF89</div><h2>Deck done!</h2><p>You went through '+q.length+' cards. +10 XP</p><button class="btn g" id="again">Go again</button> <button class="btn w" id="hm">Home</button></div>'),$('again').onclick=function(){flashcards(list,title);},$('hm').onclick=home;}
  var it=q[i],f=face(it);

  '<div class="flash"><div class="fc'+(back?' back':'')+'" id="fc"><div><small>'+esc(back?f[2]:f[0])+'</small>'+(back?(it.kind==='seq'?f[3]:esc(f[3])):esc(f[1]))+'<small style="margin-top:12px">'+(back?'':'Tap to flip')+'</small></div></div></div>'+
  '<div class="row"><button class="btn r" id="again" style="flex:1">Study again</button><button class="btn g" id="got" style="flex:1">Got it</button></div>';
  shell(title,inner);
  var fc=$('fc');

  $('again').onclick=function(){var s=stat(it.id);s.miss=true;s.s=0;save();i++;back=false;draw();};

/* ---------- multiple choice runner ---------- */
function runMC(list,cfg){
 if(!list.length)return empty(cfg.title,'No questions for this topic yet.');
 var i=0,score=0,right=0,streak=0,bestS=0,timed=cfg.timed||0,left=timed,over=false,queue=list.slice(),miss=[],cur=null,answered=false,sortStreak=0,sortBest=0;
 function fin(){
  if(over)return;over=true;stopTimer();
  var msg='',xp=0;
  if(cfg.mode==='speed'){
   if(score>S.best.speed){S.best.speed=score;msg='New best score! ';}
   if(score>=150)badge('speed150');if(score>=300)badge('speed300');
   xp=Math.round(score/5);
  }else{xp=right*3;if(cfg.mode==='quiz'&&right===queue.length&&queue.length>=10)badge('perfect');}
  if(cfg.mode==='sort'&&sortBest>=10)badge('sorter');
  addXP(xp);save();
  var st=(cfg.mode==='speed')?'<div class="stat"><b>'+score+'</b><span>Points</span></div>':'';
  shell(cfg.title,'<div class="card"><div class="big">'+(right>=queue.length*0.8||cfg.mode==='speed'?'\uD83C\uDFC6':'\uD83D\uDCAA')+'</div><h2>'+msg+'Round complete!</h2><div class="row">'+st+'<div class="stat"><b>'+right+'/'+(cfg.mode==='speed'?i:queue.length)+'</b><span>Correct</span></div><div class="stat"><b>'+bestS+'</b><span>Best streak</span></div><div class="stat"><b>+'+xp+'</b><span>XP</span></div></div>'+
  (miss.length?'<p><b>Missed:</b> '+miss.map(function(m){return esc(m);}).join('; ')+'</p><p class="tl">Missed items are saved in Missed Items mode.</p>':'<p>No misses. Amazing!</p>')+
  '<button class="btn g" id="again">Play again</button> <button class="btn w" id="hm">Home</button></div>');
  $('again').onclick=function(){go(cfg.mode==='review'?'review':cfg.mode);};$('hm').onclick=home;
 }
 function next(){
  if(over)return;
  if(cfg.mode==='speed'&&i>=queue.length){queue=queue.concat(shuf(list));}
  if(i>=queue.length)return fin();
  var it=queue[i],mc=makeMC(it);cur=it;answered=false;
  if(!mc){i++;return next();}
  var hud='<div class="hud">'+(cfg.mode==='speed'?'<div class="pill" id="tm">\u23F1 '+left+'s</div>':'<div class="pill">Q '+(i+1)+'/'+queue.length+'</div>')+'<div class="sp"></div><div class="pill">\uD83D\uDD25 '+streak+'</div><div class="pill">\u2B50 '+score+'</div></div>';
  var body='<div class="card"><div class="q"><small>'+esc(mc.hint)+'</small>'+esc(mc.text)+'</div><div id="chs">'+mc.choices.map(function(c,k){return '<button class="ch" data-k="'+k+'">'+esc(c.t)+'</button>';}).join('')+'</div><div id="fb"></div></div>';
  shell(cfg.title,hud+body);
  var bs=app.querySelectorAll('.ch');
  for(var b=0;b<bs.length;b++)bs[b].onclick=function(){
   if(answered||over)return;answered=true;
   var k=+this.getAttribute('data-k'),ok=!!mc.choices[k].ok;
   for(var z=0;z<bs.length;z++){bs[z].disabled=true;if(mc.choices[z].ok)bs[z].classList.add('ok');}
   if(!ok)this.classList.add('bad');
   record(it,ok);
   if(ok){streak++;right++;if(streak>bestS)bestS=streak;if(streak>S.bestStreak)S.bestStreak=streak;
    var pts=10+Math.min(streak,10)*2;score+=pts;addXP(cfg.mode==='speed'?1:2);sOk();
    if(streak===5)badge('s5');if(streak===10)badge('s10');if(streak===20)badge('s20');
    sortStreak++;if(sortStreak>sortBest)sortBest=sortStreak;
   }else{streak=0;sortStreak=0;sBad();if(miss.indexOf(it.term||it.q||it.name)<0)miss.push(it.term||it.q||it.name);if(cfg.mode==='speed'){left=Math.max(0,left-3);}}
   save();
   var fbEl=$('fb');
   if(cfg.mode==='speed'){
    setTimeout(function(){i++;next();},ok?350:1100);
    if(!ok)fbEl.innerHTML='<div class="fb bad">'+esc(mc.why)+' (-3s)</div>';
    else fbEl.innerHTML='<div class="fb ok">+'+(10+Math.min(streak,10)*2)+'</div>';
   }else{
    fbEl.innerHTML='<div class="fb '+(ok?'ok':'bad')+'">'+(ok?'\u2705 Correct! ':'\u274C Not quite. ')+esc(mc.why)+'</div><p><button class="btn" id="nx">'+(i+1>=queue.length?'Finish':'Next')+'</button></p>';

     if(Object.keys(done).length===total)return finish();

 }

function runOrder(queue){

 }

}

function waSentences(text){
 var bits=String(text||'').split(/[.!?]+/), n=0;
 bits.forEach(function(b){ var w=b.trim().split(/\s+/).filter(Boolean); if(w.length>=3) n++; });
 return n;
}
function waHit(text, keys){
 var t=String(text||'').toLowerCase();
 for(var i=0;i<keys.length;i++) if(t.indexOf(keys[i])>=0) return true;
 return false;
}
function waSaltTrap(text){
 var t=String(text||'').toLowerCase();
 var claims=/\blots of salt\b|\bown salt\b|\bplenty of salt\b|\bghana had salt\b|\bhad lots of salt\b|\bproduced salt\b|\bsalt mines in ghana\b|\bghana's salt\b/.test(t);
 var fromNorth=/taghaza|from the north|across the sahara|\bsahara\b/.test(t);
 return claims && !fromNorth;
}
function waLandTrap(text){
 var t=String(text||'').toLowerCase();
 if(/good land|good farmland|fertile land|rich soil|good soil/.test(t) && !/not because|did not|does not|wasn't|was not/.test(t)) return true;
 return false;
}

 c.setLineDash([0.16,0.28]);c.lineDashOffset=-(u.time*0.45);c.strokeStyle='rgba(255,248,230,.8)';c.lineWidth=0.08;c.stroke();c.setLineDash([]);
 var ce=TD_WP[TD_WP.length-1];
 c.fillStyle='#a56b3c';c.fillRect(ce[0]-0.7,ce[1]-0.85,1.4,0.95);
 c.fillStyle='#6b3e26';c.fillRect(ce[0]-0.16,ce[1]-0.42,0.32,0.52);
 c.fillStyle='#e0a045';c.beginPath();c.moveTo(ce[0]-0.85,ce[1]-0.8);c.lineTo(ce[0],ce[1]-1.25);c.lineTo(ce[0]+0.85,ce[1]-0.8);c.fill();
 c.strokeStyle='#4a2c1a';c.lineWidth=0.05;c.strokeRect(ce[0]-0.7,ce[1]-0.85,1.4,0.95);
 tdText(c,u,'KUMBI',ce[0],ce[1]+0.32,Math.max(8,T*0.22),'#4a2c1a',true);
 tdText(c,u,String(g.lives),ce[0],ce[1]-0.55,Math.max(11,T*0.32),'#fff8ee',true);
 tdText(c,u,'trail',0.7,1.05,Math.max(8,T*0.18),'#6b3e26',true);
 if(u.selType&&!u.asking){for(i=0;i<TD_TILES.length;i++){var tl=TD_TILES[i];if(tdTileFree(g,tl[0],tl[1])){tdCircle(c,tl[0]+0.5,tl[1]+0.5,0.07+0.02*Math.sin(u.time*4),'rgba(224,160,69,.85)');}}}
 if(u.hover&&u.selType&&tdTileFree(g,u.hover[0],u.hover[1])){
  var hx=u.hover[0]+0.5,hy=u.hover[1]+0.5,hs=TD_TOWERS[u.selType].lv[0];
  tdCircle(c,hx,hy,hs.range,'rgba(154,52,18,.12)','rgba(154,52,18,.45)',0.03);tdDrawTower(c,u,u.selType,hx,hy,-1.57,0.7);
 }
 if(u.selTower){var st=tdStats(u.selTower);tdCircle(c,u.selTower.x,u.selTower.y,st.range,'rgba(154,52,18,.12)','rgba(154,52,18,.6)',0.04);}
 for(i=0;i<g.towers.length;i++){var t=g.towers[i];tdDrawTower(c,u,t,t.x,t.y,t.ang,1);if(t===u.selTower){c.strokeStyle='#e0a045';c.lineWidth=0.07;c.strokeRect(t.x-0.46,t.y-0.48,0.92,0.92);}}
 for(i=0;i<g.enemies.length;i++)if(g.enemies[i].d>0.1)tdDrawEnemy(c,u,g.enemies[i]);
 for(i=0;i<g.projs.length;i++){var p=g.projs[i];if(p.k==='b'){tdCircle(c,p.x,p.y,0.07,'#f6e7c1','#6b3e26',0.03);}else{tdCircle(c,p.x,p.y,0.13,'#e0a045','#8c3d16',0.04);}}
 for(i=0;i<g.fx.length;i++){
  var f=g.fx[i],k=f.life/f.max;
  if(f.k==='p'){c.globalAlpha=Math.max(0,k);c.fillStyle=f.c;c.fillRect(f.x-f.s/2,f.y-f.s/2,f.s,f.s);c.globalAlpha=1;}
  else if(f.k==='r'){var rr=f.r0+(f.r1-f.r0)*(1-k);c.globalAlpha=Math.max(0,k)*0.8;c.beginPath();c.arc(f.x,f.y,rr,0,6.2832);c.strokeStyle=f.c;c.lineWidth=0.08;c.stroke();c.globalAlpha=1;}
  else if(f.k==='b'){c.globalAlpha=Math.max(0,k);c.beginPath();c.moveTo(f.x,f.y);c.lineTo(f.x1,f.y1);c.strokeStyle=f.c;c.lineWidth=0.12;c.stroke();c.strokeStyle='#fff8ee';c.lineWidth=0.04;c.stroke();c.globalAlpha=1;}
  else if(f.k==='t'){c.globalAlpha=Math.max(0,k);tdText(c,u,f.text,f.x,f.y,Math.max(10,T*0.28),f.c,true);c.globalAlpha=1;}
 }
 if(g.hurt>0){c.fillStyle='rgba(160,30,20,'+(g.hurt*0.28)+')';c.fillRect(0,0,TD_COLS,TD_ROWS);}
 if(u.paused){c.fillStyle='rgba(74,44,26,.55)';c.fillRect(0,0,TD_COLS,TD_ROWS);tdText(c,u,'PAUSED',TD_COLS/2,TD_ROWS/2,Math.max(24,T*0.7),'#fff8ee',true);}
}

/* ---------- boot + test hooks ---------- */
window.SamGame={TD:TD,tdUI:function(){return tdUI;},items:ITEMS,makeMC:makeMC,state:function(){return S;},home:home,go:go,
 coverage:function(){
  var out={total:ITEMS.length,noPath:[]};
  ITEMS.forEach(function(it){
   var ok=false;
   if(it.kind==='pair'||it.kind==='fact'||it.kind==='sort')ok=!!makeMC(it);
   else ok=['seq','five','lookup','goal','skipped'].indexOf(it.kind)>=0;
   if(!ok)out.noPath.push(it.id);
  });
  return out;}};
window.SamGame.pickWeighted=pickWeighted;
if(/selftest=1/.test(location.search)){
 var lines=[];
 try{
  var cov=window.SamGame.coverage();
  lines.push('items '+cov.total);
  lines.push('nopath '+cov.noPath.length+(cov.noPath.length?(' '+cov.noPath.join(',')):''));
  var g=TD.newGame({noFx:true,coins:500});
  var placed=0, keys=['ab','wbc','laser','vac'];
  TD.TILES.forEach(function(tl){ if(placed<4 && TD.free(g,tl[0],tl[1])){ if(TD.place(g,keys[placed],tl[0],tl[1]))placed++; }});
  lines.push('placed '+placed+' dust '+g.coins);
  if(!TD.startWave(g))lines.push('wave failed to start');
  var n; for(n=0;n<8000 && g.phase==='wave';n++)TD.step(g,0.05);
  lines.push('phase '+g.phase+' wave '+g.wave+' lives '+g.lives+' kills '+g.kills+' left '+g.enemies.length+' steps '+n);
  var bad=0;
  ITEMS.forEach(function(it){
   if(it.kind==='pair'||it.kind==='fact'||it.kind==='sort'){
    var mc=makeMC(it);
    if(!mc||!mc.choices||mc.choices.length<2){bad++;lines.push('mc fail '+it.id);return;}
    var oks=mc.choices.filter(function(c){return c.ok;});
    if(oks.length!==1){bad++;lines.push('okcount '+it.id+' '+oks.length);}
    var seen={};
    mc.choices.forEach(function(c){ if(!c.t){bad++;lines.push('empty '+it.id);} if(seen[c.t]){bad++;lines.push('dup '+it.id);} seen[c.t]=1; });
   }
  });
  lines.push('mcbad '+bad);
  var hi=ITEMS.filter(function(i){return i.hi;}).length;
  lines.push('highlighted '+hi);
  lines.push(bad===0 && placed===4 && g.phase!=='wave' ? 'SELFTEST OK' : 'SELFTEST ISSUE');
 }catch(err){ lines.push('EX '+err.message); }
 document.body.innerHTML='<pre id="selftest">'+lines.join('\n')+'</pre>';
} else home();
})();
</script>
