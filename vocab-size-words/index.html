<!DOCTYPE html>
<html lang="en">
<head>

<title>Size Words Vocabulary</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(165deg,#24145a 0%,#5b3df5 48%,#e8a317 100%);background-attachment:fixed;min-height:100vh;color:#1d1b3a}
#app{max-width:760px;margin:0 auto;padding:10px 12px calc(28px + env(safe-area-inset-bottom))}
.top{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.top .logo{font-size:26px}
.top .who{flex:1;min-width:0}
.top .lvl{font-weight:800;font-size:15px}
.bar{height:12px;background:#e3e0ff;border-radius:8px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff9f1c,#ff3d81);border-radius:8px;transition:width .4s}
.tbtn{border:0;background:#efeaff;border-radius:12px;padding:8px 10px;font-size:18px;cursor:pointer}
h1{color:#fff;text-align:center;margin:16px 0 4px;font-size:28px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.sub{color:#fff;text-align:center;margin:0 0 12px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 12px}
.chip{border:0;border-radius:20px;padding:8px 14px;font-weight:800;background:rgba(255,255,255,.35);color:#fff;cursor:pointer;font-size:14px}
.chip.on{background:#fff;color:#3b2494;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.mode{border:0;border-radius:20px;padding:14px 8px;color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.22);text-align:center;min-height:104px;transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.mode .e{display:block;font-size:32px;margin-bottom:4px}
.mode small{display:block;font-weight:600;font-size:12px;opacity:.95;margin-top:2px}
.c1{background:#ff3d81}.c2{background:#ff9f1c}.c3{background:#7c4dff}.c4{background:#00b894}.c5{background:#0984e3}.c6{background:#e17055}.c7{background:#0f766e}.c8{background:#6c5ce7}.c9{background:#00a8a8}
.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.card h2{margin:0 0 8px;font-size:20px}
.card h3{margin:12px 0 4px;font-size:16px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:#f4f1ff;border-radius:14px;padding:8px;text-align:center}
.stat b{display:block;font-size:22px;color:#4c2db8}
.stat span{font-size:12px;font-weight:700}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:800;color:#fff;background:#4c2db8;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(2px)}
.btn.g{background:#00b894}.btn.r{background:#ff3d81}.btn.o{background:#ff9f1c}.btn.w{background:#eee;color:#333}
.btn[disabled]{opacity:.45}
.hud{display:flex;gap:8px;align-items:center;color:#fff;font-weight:800;margin:10px 0}
.hud .sp{flex:1}
.hud .pill{background:rgba(0,0,0,.25);border-radius:14px;padding:6px 10px}
.q{font-size:20px;font-weight:800;line-height:1.35}
.q small{display:block;font-size:13px;color:#6b64a8;margin-bottom:4px}
.ch{display:block;width:100%;text-align:left;border:3px solid #e3e0ff;background:#fff;border-radius:14px;padding:12px;margin:8px 0;font-size:16px;font-weight:700;cursor:pointer;color:#1d1b3a;line-height:1.35}
.ch:active{background:#f4f1ff}
.ch.ok{background:#c9f7e2;border-color:#00b894}
.ch.bad{background:#ffd6e3;border-color:#ff3d81}
.ch[disabled]{cursor:default}
.fb{margin-top:10px;padding:10px;border-radius:12px;font-weight:700}
.fb.ok{background:#c9f7e2}.fb.bad{background:#ffe0e9}
.flash{perspective:900px;margin:12px 0}
.fc{min-height:230px;border-radius:22px;padding:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:26px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);background:linear-gradient(135deg,#ffe08a,#f0a202);color:#3a2300;animation:pop .25s}
.fc>div{width:100%}
.fc.back{background:linear-gradient(135deg,#c8f7e4,#00b894);color:#042e2a;font-size:17px;font-weight:700;line-height:1.4;align-items:flex-start;text-align:left;overflow:auto;max-height:68vh}
.fc small{display:block;font-size:13px;font-weight:700;margin-bottom:8px;opacity:.75}
.fc .note{font-size:14px;font-weight:700;margin:10px 0 0}
@keyframes pop{from{transform:scale(.94);opacity:.5}to{transform:scale(1);opacity:1}}
.mgrid{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}
.mt{border:3px solid #e3e0ff;background:#fff;border-radius:12px;padding:10px 8px;font-weight:800;font-size:14px;cursor:pointer;text-align:left;color:#1d1b3a}
.mt.sel{border-color:#7c4dff;background:#efeaff}
.mt.done{background:#c9f7e2;border-color:#00b894;opacity:.7}
.mt.wrong{animation:shake .35s;border-color:#ff3d81;background:#ffd6e3}
.mt.def{font-weight:600;font-size:13px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.bank{display:flex;flex-direction:column;gap:6px}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.badge{background:#f4f1ff;border-radius:14px;padding:8px;text-align:center;font-size:12px;font-weight:700;opacity:.4;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;background:#fff3c4}
.badge b{display:block;font-size:26px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1d1b3a;color:#fff;padding:10px 16px;border-radius:16px;font-weight:800;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90%;text-align:center;animation:pop .25s}
body.tdon .toast{top:58px}
.back{color:#fff;background:rgba(0,0,0,.25);border:0;border-radius:14px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:15px}
label.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eee;font-weight:600;cursor:pointer}
label.chk input{width:22px;height:22px;flex:none;margin-top:2px}
details{margin:6px 0}
summary{font-weight:800;cursor:pointer;padding:4px 0}
.tl{margin:4px 0 10px;font-size:14px}
.tl b{color:#4c2db8}
.big{font-size:44px;text-align:center}
.tag{font-size:11px;background:#efeaff;border-radius:8px;padding:2px 6px;margin-left:4px;color:#4c2db8;font-weight:800}
.c10{background:#b33771}
.tdwrap{color:#1d1b3a}
.tdbar{display:flex;gap:5px;align-items:center;margin:6px 0}
.tdbar .sp{flex:1}
.tdbar .pill{background:rgba(0,0,0,.3);color:#fff;font-weight:800;border-radius:14px;padding:6px 8px;font-size:13px;white-space:nowrap}
.tdbar .back{padding:6px 10px;font-size:13px}
.tdmain{display:flex;flex-direction:column;align-items:center;gap:8px}
.tdcv{position:relative;line-height:0;border-radius:14px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.2);background:#1a1448}
#tdcv{touch-action:none;display:block}
.tdmsg{position:absolute;left:6px;right:6px;top:6px;background:rgba(29,27,58,.88);color:#fff;font-weight:700;font-size:13px;line-height:1.25;border-radius:10px;padding:6px 8px;text-align:center;pointer-events:none;transition:opacity .3s}
.tdmsg.off{opacity:0}
.tdside{width:100%}
.tdctl{display:flex;gap:6px}
.tdctl .btn{padding:10px 6px;font-size:14px;flex:1;white-space:nowrap}
.tdans{width:100%;margin:8px 0;background:linear-gradient(90deg,#ff9f1c,#ff3d81);font-size:17px;padding:12px 10px;line-height:1.2}
.tdans small{display:block;font-weight:700;font-size:12px;margin-top:2px}
.tdshop{display:grid;grid-template-columns:repeat(4,1fr);gap:6px}
.tdt{border:3px solid transparent;background:#fff;border-radius:14px;padding:5px 2px;font-weight:800;font-size:12px;cursor:pointer;color:#1d1b3a;text-align:center;box-shadow:0 3px 0 rgba(0,0,0,.2);line-height:1.2}
.tdt .e{display:block;font-size:22px}
.tdt.on{border-color:#ff9f1c;background:#fff3c4}
.tdt.no{opacity:.6}
.tdinfo{margin:8px 0 0;padding:10px 12px;font-size:14px}
.tdinfo b{color:#4c2db8}
.tdinfo .row .btn{flex:1;padding:10px 8px;font-size:14px}
.tdov{position:fixed;left:0;top:0;right:0;bottom:0;background:rgba(20,10,60,.72);display:flex;overflow:auto;padding:12px;z-index:40}
.tdq{margin:auto;width:100%;max-width:520px}
.tdq .q{font-size:18px;margin-top:6px}
.tdq .ch{font-size:15px;padding:10px}
.wide .tdmain{flex-direction:row;align-items:flex-start;justify-content:center}
.wide .tdside{width:340px}
textarea.ans,input.blank{width:100%;border:3px solid #d9d4ff;border-radius:14px;padding:12px;font:16px/1.45 "Trebuchet MS",system-ui,sans-serif;color:#1d1b3a;background:#fff}
textarea.ans{min-height:130px;resize:vertical}
.spec{display:flex;gap:8px;align-items:flex-start;padding:5px 0;font-weight:700}
.spec.ok{color:#0b6b45}.spec.bad{color:#8a2040}
input.blank.ok{border-color:#0b6b45;background:#e8fff4}
input.blank.bad{border-color:#c0392b;background:#fff0f3}
.ch,.mt,.q,.fc,.card{overflow-wrap:anywhere}
@media(max-width:560px){
 .mgrid{grid-template-columns:1fr}
 h1{font-size:24px}
 .q{font-size:18px}
 .fc{font-size:22px;min-height:200px}
 .mode{font-size:15px}
 .tdshop{grid-template-columns:repeat(2,1fr)}
}
</style>
</head>
<body>
<div id="app"></div>
<script>
var SAM_TOPICS = [
 {id:'small', name:'Small roots', emoji:'\uD83D\uDD2C'},
 {id:'great', name:'Great roots', emoji:'\uD83C\uDF1F'},
 {id:'poly', name:'Many (poly)', emoji:'\uD83D\uDD37'},
 {id:'thin', name:'Thin (ten)', emoji:'\uD83D\uDCCF'},
 {id:'more', name:'More words', emoji:'\uD83D\uDCD8'}
];
/* term, definition (verbatim), topic, root hint, extra sense note */
var VW_VERBATIM = [
 ['Attenuate','To reduce the force, effect, thickness, or value of something; to weaken or make slender.','thin','ten = thin',''],
 ['Comply','To act in accordance with a wish, request, rule, or command.','more','ple = fill',''],
 ['Expletive','An oath or swear word; in grammar, a word or phrase that fills out a sentence without adding meaning (such as "it" or "there" in empty subject positions).','more','ple = fill','Two senses. One is an oath or swear word. This game never shows those words. The other is a grammar filler, such as "it" or "there", that fills out a sentence without adding meaning.'],
 ['Implement','To put a decision, plan, or agreement into effect; as a noun, a tool or instrument used for a specific task.','more','ple = fill','Two senses. As a verb, put a decision, plan, or agreement into effect. As a noun, a tool or instrument used for a specific task.'],
 ['Microbe','A microscopic living organism, especially a bacterium, virus, or fungus, particularly one that causes disease or fermentation.','small','micro = small',''],
 ['Microcosm','A community, place, or situation regarded as encapsulating in miniature the characteristic qualities or features of something much larger.','small','micro = small',''],
 ['Minuscule','Extremely small or tiny.','small','mini / minu = small',''],
 ['Minutia','Precise, trivial, or minor details (commonly used in the plural, minutiae).','small','mini / minu = small',''],
 ['Replete','Filled or well-supplied with something; gorged or full to satisfaction, especially with food and drink.','more','ple = fill',''],
 ['Satiate','To satisfy a desire, appetite, or need fully, often to the point of excess or boredom.','more','satis = enough',''],
 ['Tenuous','Very weak, slight, or flimsy; having little substance or basis.','thin','ten = thin',''],
 ['Copious','Abundant in supply, quantity, or volume; plentiful.','more','copia = plenty',''],
 ['Macrocosm','The whole of a complex structure, such as the universe or society, contrasted with a smaller or representative part of it.','great','macro = large',''],
 ['Magnanimous','Generous, forgiving, and noble in spirit, especially toward a rival or someone less powerful.','great','magn = great',''],
 ['Magnate','A wealthy, influential, and powerful person, especially in a specific business or industry (such as a real estate or oil tycoon).','great','magn = great',''],
 ['Magnitude','The great size, extent, importance, or scale of something; in science, a numerical measure of brightness or earthquake energy.','great','magn = great',''],
 ['Megalomania','An obsession with the exercise of power, especially in the domination of others; a delusional belief in one\'s own greatness or importance.','great','mega = great',''],
 ['Polygamy','The practice or custom of having more than one spouse at the same time.','poly','poly = many',''],
 ['Polygon','A flat, two-dimensional geometric shape with at least three straight sides and angles.','poly','poly = many','']
];
var CONFUSE = {
 'Attenuate':['Tenuous','Satiate','Comply','Implement'],
 'Comply':['Implement','Magnanimous','Attenuate','Expletive'],
 'Expletive':['Replete','Implement','Comply','Copious'],
 'Implement':['Comply','Expletive','Magnate','Polygon'],
 'Microbe':['Microcosm','Minuscule','Minutia','Macrocosm'],
 'Microcosm':['Macrocosm','Microbe','Minuscule','Minutia'],
 'Minuscule':['Minutia','Microbe','Tenuous','Microcosm'],
 'Minutia':['Minuscule','Microcosm','Magnitude','Microbe'],
 'Replete':['Satiate','Copious','Expletive','Magnitude'],
 'Satiate':['Replete','Copious','Attenuate','Comply'],
 'Tenuous':['Attenuate','Minuscule','Magnitude','Copious'],
 'Copious':['Replete','Satiate','Magnitude','Magnanimous'],
 'Macrocosm':['Microcosm','Magnitude','Megalomania','Magnate'],
 'Magnanimous':['Magnate','Magnitude','Megalomania','Comply'],
 'Magnate':['Magnanimous','Magnitude','Megalomania','Implement'],
 'Magnitude':['Magnate','Magnanimous','Megalomania','Copious'],
 'Megalomania':['Magnate','Magnanimous','Magnitude','Macrocosm'],
 'Polygamy':['Polygon','Megalomania','Magnate','Microcosm'],
 'Polygon':['Polygamy','Microcosm','Magnitude','Implement']
};
/* Fill-in-the-blank context questions. The answer is always one of the 19 words. */
var VW_FACTS = [
 {q:'Earplugs are used to ____ the force of a loud drumline so the sound is weaker.', a:'Attenuate', topic:'thin', w:['Tenuous','Satiate','Comply'],
  why:'Earplugs reduce the force of the sound. That action is attenuate. Tenuous describes something that is already weak. It is not the action of weakening it.'},
 {q:'Stretching a clay rope is a way to ____ its thickness and make it more slender.', a:'Attenuate', topic:'thin', w:['Tenuous','Minuscule','Copious'],
  why:'To attenuate is to reduce thickness or make something slender. Minuscule means extremely small already. Tenuous means weak or flimsy.'},
 {q:'The pool posts a rule. To ____, swimmers walk instead of run.', a:'Comply', topic:'more', w:['Implement','Magnanimous','Attenuate'],
  why:'Comply means to act in accordance with a rule. Implement means to put a plan into effect. This sentence is about following a rule that is already posted.'},
 {q:'When a teacher makes a request, to ____ is to act in accordance with it.', a:'Comply', topic:'more', w:['Satiate','Replete','Magnanimous'],
  why:'Comply means to act in accordance with a wish, request, rule, or command.'},
 {q:'One sense of ____ is an oath or swear word. This game never shows those words.', a:'Expletive', topic:'more', w:['Implement','Replete','Comply'],
  why:'This is the oath sense of expletive. The game names that sense and never prints an actual swear word. The other sense is grammar.'},
 {q:'The play script says the pirate shouts an ____ when the map rips. The script does not print the word, because this sense means an oath or swear word.', a:'Expletive', topic:'more', w:['Implement','Copious','Minutia'],
  why:'An expletive can be an oath or swear word. The script, and this game, leave the word out.'},
 {q:'In "It is snowing," the word "it" does not name a thing. It is an ____ that fills out the sentence without adding meaning.', a:'Expletive', topic:'more', w:['Replete','Implement','Copious'],
  why:'This is the grammar sense. "It" fills out "It is snowing" without naming a thing. Replete means filled with something, often food. That is a different word.'},
 {q:'In "There are two pizzas on the table," the word "there" is an ____ in an empty subject position.', a:'Expletive', topic:'more', w:['Replete','Minutia','Polygon'],
  why:'"There" fills out the sentence and does not add meaning. That is the grammar sense of expletive.'},
 {q:'The student council made a book-drive plan. Next week the council will start to ____ it, putting the plan into effect.', a:'Implement', topic:'more', w:['Comply','Attenuate','Satiate'],
  why:'To implement a plan is to put it into effect. To comply would mean following a rule, not launching the plan.'},
 {q:'The team agreed on a new warm-up. To ____ the agreement means to actually use it at practice.', a:'Implement', topic:'more', w:['Comply','Magnanimous','Expletive'],
  why:'Implement means to put an agreement into effect. The team does the warm-up they agreed on.'},
 {q:'A whisk is an ____, a tool or instrument used for the specific task of mixing.', a:'Implement', topic:'more', w:['Magnate','Polygon','Microbe'],
  why:'This is the noun sense. An implement is a tool or instrument used for a specific task. The verb sense means to put a plan into effect.'},
 {q:'The museum card called the old hoe an ____ used for a specific farming task.', a:'Implement', topic:'more', w:['Magnate','Tenuous','Copious'],
  why:'A hoe is a tool for a specific task, so it is an implement. A magnate is a powerful person, not a tool.'},
 {q:'A bacterium that can cause disease is a ____, a microscopic living organism.', a:'Microbe', topic:'small', w:['Microcosm','Minuscule','Minutia'],
  why:'A microbe is a microscopic living organism, especially one that causes disease or fermentation. A microcosm is a small model of something larger, not a germ.'},
 {q:'Yeast is a fungus used in fermentation. The list calls that kind of tiny living thing a ____.', a:'Microbe', topic:'small', w:['Microcosm','Minuscule','Macrocosm'],
  why:'A fungus that causes fermentation fits microbe. Minuscule only means extremely small. It does not say the thing is alive.'},
 {q:'The fish tank is a ____ of a coral reef: a small place that shows, in miniature, features of something much larger.', a:'Microcosm', topic:'small', w:['Macrocosm','Microbe','Minuscule'],
  why:'A microcosm encapsulates a much larger thing in miniature. The ocean reef is the larger thing. A microbe is a tiny organism, not a model of a place.'},
 {q:'The student council is a ____ of the whole school, a small community that encapsulates qualities of the larger school.', a:'Microcosm', topic:'small', w:['Macrocosm','Minutia','Magnate'],
  why:'The council is a small community that stands for the larger school. That is a microcosm. The whole school would be closer to the macrocosm.'},
 {q:'A grain of sand is ____. It is extremely small.', a:'Minuscule', topic:'small', w:['Minutia','Microbe','Tenuous'],
  why:'Minuscule means extremely small or tiny. A minutia is a minor detail, not the word for tiny size.'},
 {q:'The writing on the ant tag was ____, so tiny that a magnifying glass was needed.', a:'Minuscule', topic:'small', w:['Minutia','Tenuous','Copious'],
  why:'The writing is extremely small, so the word is minuscule. Tenuous would mean the writing was weak or flimsy, not tiny.'},
 {q:'The craft sheet listed every ____, including which way the staple should face. Those are precise minor details.', a:'Minutia', topic:'small', w:['Minuscule','Magnitude','Microcosm'],
  why:'A minutia is a precise, trivial, or minor detail. The plural is minutiae. Minuscule would describe the size of the staple, not the detail about it.'},
 {q:'You do not need every ____ of the bus schedule. Those trivial details are not the main idea. The plural is minutiae.', a:'Minutia', topic:'small', w:['Minuscule','Microbe','Copious'],
  why:'Trivial details are minutiae. The vocabulary word is minutia. Minuscule means extremely small.'},
 {q:'After a big lunch, the team was ____, full to satisfaction with food and drink.', a:'Replete', topic:'more', w:['Satiate','Copious','Expletive'],
  why:'Replete describes being filled or full to satisfaction, especially with food and drink. Satiate is the verb for satisfying a need. Copious describes a plentiful supply.'},
 {q:'The library is ____ with graphic novels. It is well-supplied with them.', a:'Replete', topic:'more', w:['Copious','Satiate','Magnitude'],
  why:'Well-supplied matches replete. Copious means the novels are plentiful, but "copious with" is not the phrase. Replete with means filled with.'},
 {q:'One slice did not ____ his appetite. A second slice satisfied it fully.', a:'Satiate', topic:'more', w:['Replete','Copious','Attenuate'],
  why:'Satiate means to satisfy an appetite fully. Replete is the state of being full, not this verb.'},
 {q:'Watching the same clip many times can ____ a viewer, satisfying the desire to the point of boredom.', a:'Satiate', topic:'more', w:['Replete','Copious','Comply'],
  why:'Satisfying a desire to the point of boredom is satiate. Copious would describe a large number of clips, not the feeling.'},
 {q:'The rope bridge looked ____, very weak and flimsy.', a:'Tenuous', topic:'thin', w:['Attenuate','Minuscule','Magnitude'],
  why:'Tenuous means very weak, slight, or flimsy. Attenuate would be the action of making the bridge weaker.'},
 {q:'The excuse had little basis. It was ____.', a:'Tenuous', topic:'thin', w:['Attenuate','Magnanimous','Copious'],
  why:'An idea with little basis is tenuous. That is the "little substance" part of the meaning.'},
 {q:'The storm brought ____ rain, abundant in volume.', a:'Copious', topic:'more', w:['Replete','Satiate','Magnitude'],
  why:'Abundant in volume means copious. Magnitude is about great size or a science number, not a plentiful supply of rain.'},
 {q:'She took ____ notes, a plentiful supply of them.', a:'Copious', topic:'more', w:['Replete','Minutia','Satiate'],
  why:'A plentiful supply is copious. Minutia would be one minor detail inside the notes, not a large supply of notes.'},
 {q:'If a fish tank is a small model of the ocean, the ocean is the ____, the whole of that larger structure.', a:'Macrocosm', topic:'great', w:['Microcosm','Magnitude','Megalomania'],
  why:'The macrocosm is the whole, contrasted with a smaller part. The fish tank is the microcosm. The ocean is the macrocosm.'},

function totalCount(){return ITEMS.length;}
function missedItems(){return ITEMS.filter(function(i){var s=S.stats[i.id];return s&&s.miss;});}
var AC=null;
function beep(f,d,t){if(!S.sound)return;try{AC=AC||new (window.AudioContext||window.webkitAudioContext)();var o=AC.createOscillator(),g=AC.createGain();o.type=t||'sine';o.frequency.value=f;g.gain.value=0.07;o.connect(g);g.connect(AC.destination);o.start();g.gain.exponentialRampToValueAtTime(0.0001,AC.currentTime+d);o.stop(AC.currentTime+d);}catch(e){}}
function sOk(){beep(660,.12);setTimeout(function(){beep(880,.14);},110);}

function sWin(){[523,659,784,1047].forEach(function(f,i){setTimeout(function(){beep(f,.18);},i*120);});}
function $(id){return document.getElementById(id);}
function esc(s){return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');}

function filtered(kinds){

  if(kinds.indexOf(i.kind)<0)return false;
  return S.topic==='all'||i.topic===S.topic;});}

function defOf(term){for(var i=0;i<PAIRS.length;i++)if(PAIRS[i].term===term)return PAIRS[i].def;return '';}
function byTerm(name){for(var i=0;i<PAIRS.length;i++)if(PAIRS[i].term===name)return PAIRS[i];return null;}
function distractors(it,n){
 var names=CONFUSE[it.term]||[], preferred=[], i, p, dis, others, rest;
 for(i=0;i<names.length;i++){p=byTerm(names[i]);if(p&&p.id!==it.id)preferred.push(p);}
 preferred=shuf(preferred);dis=preferred.slice(0,n);
 if(dis.length<n){others=PAIRS.filter(function(x){return x.id!==it.id&&dis.indexOf(x)<0&&x.topic===it.topic;});dis=dis.concat(pick(others,n-dis.length));}
 if(dis.length<n){rest=PAIRS.filter(function(x){return x.id!==it.id&&dis.indexOf(x)<0;});dis=dis.concat(pick(rest,n-dis.length));}

function makeMC(it, dir){
 if(it.kind==='pair'){
  dir=dir||it.ask||(Math.random()<0.5?'tdef':'dterm');
  var dis=distractors(it,3);
  var why=it.term+': '+it.def+(it.rootHint?' Root: '+it.rootHint:'')+(it.sense?' '+it.sense:'');
  if(dir==='dterm') return {hint:'Which word matches this meaning?',text:it.def,choices:shuf([{t:it.term,ok:true}].concat(dis.map(function(p){return {t:p.term};}))),why:why,rootHint:it.rootHint};
  return {hint:'What does this word mean?',text:it.term,choices:shuf([{t:it.def,ok:true}].concat(dis.map(function(p){return {t:p.def};}))),why:why,rootHint:it.rootHint};
 }
 if(it.kind==='fact'||it.kind==='root'){
  var w=[], seen={}; seen[it.a]=1;
  (it.w||[]).forEach(function(x){if(x&&!seen[x]){seen[x]=1;w.push(x);}});
  var whyF=it.why||'', d=defOf(it.a);
  if(d) whyF=(whyF?whyF+' ':'')+it.a+': '+d;
  if(it.rootHint) whyF=(whyF?whyF+' ':'')+'Root: '+it.rootHint;
  return {hint:it.hint||'Question',text:it.q,choices:shuf([{t:it.a,ok:true}].concat(w.slice(0,3).map(function(x){return {t:x};}))),why:whyF,rootHint:it.rootHint};
 }
 return null;
}

function runMC(list,cfg){

  (miss.length?'<p><b>Missed:</b> '+miss.map(function(m){return esc(m);}).join('; ')+'</p><p class="tl">Missed items are saved. Open Missed Items to try them again.</p>':'<p>No misses. Amazing!</p>')+
  '<button class="btn g" id="again">Play again</button> <button class="btn w" id="hm">Home</button></div>');

     var w=app.querySelectorAll('.mt');for(var k=0;k<w.length;k++){var wid=w[k].getAttribute('data-id');if(wid===a||wid===b)w[k].classList.add('wrong');}return;}

function vwHas(text, word){
 var t=' '+String(text||'').toLowerCase().replace(/\./g,'').replace(/[^a-z0-9]+/g,' ')+' ';
 var w=' '+String(word||'').toLowerCase().replace(/[^a-z0-9]+/g,' ').replace(/\s+/g,' ').trim()+' ';
 return w.trim().length>0 && t.indexOf(w)>=0;
}
function vwHasAny(text, words){for(var i=0;i<words.length;i++) if(vwHas(text, words[i])) return true; return false;}
function vwSentences(text){
 var bits=String(text||'').split(/[.!?]+/), n=0;
 bits.forEach(function(b){var w=b.trim().split(/\s+/).filter(Boolean); if(w.length>=3) n++;});
 return n;
}
function vwSpecOk(text, sp){
 var i;
 if(sp.all){for(i=0;i<sp.all.length;i++) if(!vwHas(text, sp.all[i])) return false;}
 if(sp.any&&!vwHasAny(text, sp.any)) return false;
 return true;
}
function vwNorm(s){return String(s||'').toLowerCase().replace(/[^a-z0-9 ]/g,' ').replace(/\s+/g,' ').trim().replace(/^(a|an|the) /,'');}
function swearHit(text){
 var t=' '+String(text||'').toLowerCase().replace(/[^a-z0-9]+/g,' ')+' ';
 var list=['damn','hell','crap','shit','fuck','ass','bitch','bastard','piss','dick','slut'];
 for(var i=0;i<list.length;i++) if(t.indexOf(' '+list[i]+' ')>=0) return true;
 return false;
}

  TD_SEG.push({x0:a[0],y0:a[1],x1:b[0],y1:b[1],l:l,s:acc});acc+=l;

window.SamGame={TD:TD,tdUI:function(){return tdUI;},items:ITEMS,makeMC:makeMC,state:function(){return S;},home:home,go:go,defOf:defOf,pairs:PAIRS};
if(/selftest=1/.test(location.search)){
 var lines=[], bad=0;
 try{
  lines.push('pairs '+PAIRS.length+' facts '+VW_FACTS.length+' roots '+VW_ROOTS_Q.length+' goals '+SAM_GOALS.length+' blanks '+VW_BLANKS.length+' sentblanks '+VW_SENT_BLANKS.length);
  if(PAIRS.length!==19){bad++; lines.push('paircount '+PAIRS.length);}
  if(VW_FACTS.length<20){bad++; lines.push('factcount');}
  var termSet={};
  VW_VERBATIM.forEach(function(row,i){
   termSet[row[0]]=1;
   if(!PAIRS[i]||PAIRS[i].term!==row[0]||PAIRS[i].def!==row[1]){bad++; lines.push('verbatim '+row[0]);}
  });
  var slots={};
  for(var n=0;n<80;n++){
   var mc0=makeMC(PAIRS[0],'tdef');
   for(var c=0;c<mc0.choices.length;c++) if(mc0.choices[c].ok) slots[c]=(slots[c]||0)+1;
  }
  var slotKeys=Object.keys(slots);
  lines.push('slots '+slotKeys.map(function(k){return k+':'+slots[k];}).join(','));
  if(slotKeys.length<3){bad++; lines.push('shuffle stuck');}
  var senses={oath:0,grammar:0,verb:0,noun:0};
  ITEMS.forEach(function(it){
   if(it.kind!=='pair'&&it.kind!=='fact'&&it.kind!=='root') return;
   var dirs=it.kind==='pair'?['tdef','dterm']:[null];
   dirs.forEach(function(dir){
    var mc=makeMC(it, dir);
    if(!mc||!mc.choices||mc.choices.length<2){bad++; lines.push('mc fail '+it.id); return;}
    var oks=mc.choices.filter(function(ch){return ch.ok;});
    if(oks.length!==1){bad++; lines.push('okcount '+it.id+' '+oks.length);}
    if((it.kind==='pair'||it.kind==='fact'||it.kind==='root')&&mc.choices.length!==4){bad++; lines.push('n '+it.id+' '+mc.choices.length);}
    var seen={};
    mc.choices.forEach(function(ch){
     if(!ch.t){bad++; lines.push('empty '+it.id);}
     if(seen[ch.t]){bad++; lines.push('dup '+it.id+' '+ch.t);}
     seen[ch.t]=1;
    });
    var pos={};
    for(var s=0;s<30;s++){var mc2=makeMC(it, dir); mc2.choices.forEach(function(ch,idx){if(ch.ok)pos[idx]=1;});}
    if(Object.keys(pos).length<2){bad++; lines.push('stuck '+it.id+' '+dir);}
   });
   if(it.kind==='fact'&&!termSet[it.a]){bad++; lines.push('fact term '+it.id+' '+it.a);}
   if((it.kind==='fact'||it.kind==='root')&&it.a==='Expletive'){
    var blob=(it.q||'')+' '+(it.why||'');
    if(/oath|swear/.test(blob)) senses.oath++;
    if(/"it"|"there"|empty subject/.test(blob)) senses.grammar++;
   }
   if((it.kind==='fact'||it.kind==='root')&&it.a==='Implement'){
    var blob2=(it.q||'')+' '+(it.why||'');
    if(/into effect|plan|agreement/.test(blob2)) senses.verb++;
    if(/tool|instrument|whisk|hoe/.test(blob2)) senses.noun++;
   }
  });
  lines.push('senses oath '+senses.oath+' grammar '+senses.grammar+' verb '+senses.verb+' noun '+senses.noun);
  if(senses.oath<1||senses.grammar<1||senses.verb<1||senses.noun<1){bad++; lines.push('missing sense');}
  var kid=JSON.stringify({v:VW_VERBATIM,f:VW_FACTS,r:VW_ROOTS_Q,g:ROOT_GUIDE,t:SAM_TIPS,p:VW_PROMPTS,b:VW_BLANKS,s:VW_SENT_BLANKS,goals:SAM_GOALS});
  ['damn','hell','crap','shit','fuck','bitch','bastard','piss'].forEach(function(w){
   var padded=' '+kid.toLowerCase().replace(/[^a-z0-9]+/g,' ')+' ';
   if(padded.indexOf(' '+w+' ')>=0){bad++; lines.push('banned '+w);}
  });
  if(/\u2014|\u2013/.test(kid)){bad++; lines.push('dash');}
  var polyExtra=false;
  VW_FACTS.concat(VW_ROOTS_Q).forEach(function(item){
   var text=((item.q||'')+' '+(item.why||'')).toLowerCase();
   if(item.a==='Polygamy'||text.indexOf('polygamy')>=0){
    if(/husband|wife|wives|married|marriage|wedding|divorce/.test(text)) polyExtra=true;
   }
  });
  if(polyExtra){bad++; lines.push('polygamy extra');}
  VW_BLANKS.forEach(function(b){
   var def=defOf(b.answer);
   if(def!==b.prompt){bad++; lines.push('blank def '+b.answer);}
  });
  var g=TD.newGame({noFx:true,coins:500});
  var placed=0, keys=['ab','wbc','laser','vac'];
  TD.TILES.forEach(function(tl){ if(placed<4 && TD.free(g,tl[0],tl[1])){ if(TD.place(g,keys[placed],tl[0],tl[1])) placed++; }});
  lines.push('placed '+placed+' coins '+g.coins);
  if(!TD.startWave(g)) lines.push('wave failed');
  var steps; for(steps=0; steps<8000 && g.phase==='wave'; steps++) TD.step(g,0.05);
  lines.push('phase '+g.phase+' wave '+g.wave+' lives '+g.lives+' kills '+g.kills+' steps '+steps);
  if(placed!==4 || g.phase==='wave') bad++;
  lines.push('bad '+bad);
  lines.push(bad===0 ? 'SELFTEST OK' : 'SELFTEST ISSUE');
 }catch(err){ lines.push('EX '+err.message); lines.push(err.stack); }
 document.body.innerHTML='<pre id="selftest">'+lines.join('\n')+'</pre>';
} else home();

})();
