<title>Middle East and Central Asia Map Quiz</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,#5b3df5 0%,#1fa2ff 55%,#12d8a4 100%);background-attachment:fixed;min-height:100vh;color:#1d1b3a}
#app{max-width:820px;margin:0 auto;padding:8px 10px 40px}
h1{color:#fff;text-align:center;margin:12px 0 2px;font-size:26px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.sub{color:#fff;text-align:center;margin:0 0 10px;font-weight:600}
.sub a{color:#fff;font-weight:800}
.nav{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin:4px 0 8px}
.nav button{border:0;border-radius:20px;padding:10px 14px;font-weight:800;background:rgba(255,255,255,.35);color:#fff;cursor:pointer;font-size:15px;min-height:44px;font-family:inherit}
.nav button.on{background:#fff;color:#5b3df5;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.card{background:#fff;border-radius:20px;padding:14px;margin:10px 0;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.card h2{margin:0 0 8px;font-size:20px}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.mode{border:0;border-radius:20px;padding:14px 8px;color:#fff;font-weight:800;font-size:18px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.22);text-align:center;min-height:100px;font-family:inherit}
.mode:active{transform:translateY(3px)}
.mode .e{display:block;font-size:30px;margin-bottom:4px}
.mode small{display:block;font-weight:600;font-size:13px;margin-top:2px}
.c1{background:#0984e3}.c2{background:#ff3d81}.c3{background:#7c4dff}.c4{background:#ff9f1c}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:17px;font-weight:800;color:#fff;background:#5b3df5;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2);min-height:48px;font-family:inherit}
.btn:active{transform:translateY(2px)}
.btn.g{background:#00b894}.btn.r{background:#ff3d81}.btn.o{background:#ff9f1c}.btn.w{background:#eee;color:#333}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.pl{font-weight:800;font-size:15px;margin:10px 0 4px;display:flex;justify-content:space-between}
.bar{height:16px;background:#e3e0ff;border-radius:8px;overflow:hidden}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff9f1c,#ff3d81);border-radius:8px;transition:width .4s}
.prompt{background:#fff;border-radius:18px;padding:10px 14px;margin:6px 0;box-shadow:0 4px 0 rgba(0,0,0,.15);display:flex;align-items:center;gap:10px}
.prompt .q{flex:1;font-size:22px;font-weight:800;line-height:1.2}
.prompt .q small{display:block;font-size:13px;color:#6b64a8;font-weight:700}
.prompt .cnt{font-weight:800;color:#5b3df5;white-space:nowrap}
.mapbox{position:relative;background:#c5e4f3;border-radius:16px;overflow:hidden;box-shadow:0 5px 0 rgba(0,0,0,.2);border:3px solid #fff}
.mapbox svg{display:block;width:100%;aspect-ratio:1051.7/910;max-height:70vh;touch-action:manipulation;user-select:none;-webkit-user-select:none}
.zoom{display:flex;gap:6px;margin:8px 0;flex-wrap:wrap}
.zoom button{flex:1;min-width:70px;border:3px solid #fff;background:rgba(255,255,255,.85);color:#3b2fa0;border-radius:12px;padding:8px 4px;font-weight:800;font-size:14px;cursor:pointer;min-height:44px;font-family:inherit}
.zoom button.on{background:#5b3df5;color:#fff}
path.cty{stroke:#3e3a34;stroke-linejoin:round;cursor:pointer;vector-effect:non-scaling-stroke;stroke-width:1}
path.ctx{fill:#d9d6cf;cursor:default}
path.hl{fill:#ff3d81 !important;stroke:#1d1b3a;stroke-width:2.5}
path.ok{fill:#00b894 !important;stroke:#003d2e;stroke-width:2.5}
path.bad{fill:#ff7675 !important;stroke:#6b0000;stroke-width:2}
path.sel{fill:#ffd84d !important;stroke:#1d1b3a;stroke-width:2.5}
.lbl text{pointer-events:none;font-weight:800;fill:#1c1915;paint-order:stroke;stroke:#fff;stroke-linejoin:round;font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif}
.lbl text.ctxl{fill:#6d6a64;font-weight:700}
.lbl text.sea{fill:#1d4e6e;font-style:italic;font-weight:600;stroke:none}
.lbl line{stroke:#3e3a34;vector-effect:non-scaling-stroke;stroke-width:1;pointer-events:none}
.ring{fill:none;stroke:#ff3d81;vector-effect:non-scaling-stroke;stroke-width:3;pointer-events:none}
.fb{margin:8px 0;padding:12px;border-radius:14px;font-weight:700;font-size:17px;line-height:1.35}
.fb.ok{background:#c9f7e2}.fb.bad{background:#ffe0e9}.fb.info{background:#f4f1ff}
.ans{display:flex;gap:8px;margin:8px 0}
.ans input{flex:1;min-width:0;font-size:20px;padding:12px;border-radius:14px;border:3px solid #c9c2ff;font-family:inherit;font-weight:700}
.ans input:focus{outline:none;border-color:#5b3df5}
.big{font-size:34px;font-weight:800;text-align:center;margin:2px 0}
.tiles{display:flex;flex-wrap:wrap;gap:4px;justify-content:center;margin:6px 0}
.tiles span{display:inline-block;min-width:28px;padding:5px 4px;border-radius:8px;background:#efeaff;color:#3b2fa0;font-weight:800;font-size:20px;text-align:center}
.tiles span.sp{background:transparent;min-width:12px}
.tiles.good span{background:#c9f7e2;color:#00513a}
.names{display:flex;flex-wrap:wrap;gap:6px}
.names button{border:2px solid #e3e0ff;background:#fff;border-radius:14px;padding:8px 10px;font-weight:800;font-size:14px;cursor:pointer;min-height:40px;font-family:inherit;color:#1d1b3a}
.names button.on{background:#ffd84d;border-color:#c9a400}
.dot{display:inline-block;width:12px;height:12px;border-radius:6px;margin-right:4px;vertical-align:middle}
.tl{font-size:14px;color:#4a4570;margin:6px 0}
ul.miss{padding-left:20px;margin:6px 0}
ul.miss li{font-weight:700;margin:3px 0}
.hint{font-size:13px;color:#fff;text-align:center;font-weight:700;margin:4px 0}
</style>
</head>

 '<div class="card"><h2>My progress</h2>'+bar('Find it: locations I know',known('find'))+bar('Name it: spellings I know',known('name'))+
 '<p class="tl">A country counts when your last answer for it was right. Best round scores: Find it '+(S.best.find==null?'none yet':S.best.find+'/22')+', Name it '+(S.best.name==null?'none yet':S.best.name+'/22')+'.</p>'+
 '<p class="tl">Quiz day: Friday, November 13. Palestine on this quiz is the West Bank and Gaza together.</p>'+
 '<div class="row"><button class="btn w" id="reset">Reset my progress</button></div></div>'+
 '<p class="sub"><a href="../">Back to all of Sam\'s study games</a></p>';
 var b=$('top').querySelectorAll('[data-go]');for(var i=0;i<b.length;i++)b[i].onclick=function(){nav(this.getAttribute('data-go'));};
 $('reset').onclick=function(){if(confirm('Erase all saved progress for this map quiz?')){S=fresh();save();nav('home');}};
}
function allMissed(){var a=missed('find'),b=missed('name');return Q.filter(function(id){return a.indexOf(id)>=0||b.indexOf(id)>=0;});}
function tilesHTML(name,cls){return '<div class="tiles'+(cls?' '+cls:'')+'">'+name.split('').map(function(ch){return ch===' '?'<span class="sp"></span>':'<span>'+esc(ch.toUpperCase())+'</span>';}).join('')+'</div>';}

/* Study */
function study(){
 setPaint('region');labelsOn=true;setView('full');
 $('top').innerHTML='<div class="prompt"><div class="q"><small>Study</small>Tap any colored country, or a name below.</div></div>';
 var groups={};Q.forEach(function(id){var r=F[id].region;(groups[r]=groups[r]||[]).push(id);});
 var h='<div class="card" id="info"><p class="tl">Use the Gulf, Levant, and Caucasus zoom buttons to see and tap the tiny countries (Qatar, Kuwait, United Arab Emirates, Lebanon, Israel, Palestine, Armenia).</p></div><div class="card"><h2>All 22 countries</h2>';
 Object.keys(DATA.groups).forEach(function(g){if(!groups[g])return;h+='<p class="tl"><span class="dot" style="background:'+DATA.groups[g].color+'"></span><b>'+esc(DATA.groups[g].name)+'</b></p><div class="names">'+groups[g].map(function(id){return '<button data-id="'+id+'">'+esc(nm(id))+'</button>';}).join('')+'</div>';});
 $('bottom').innerHTML=h+'</div>';
 var bs=$('bottom').querySelectorAll('.names button');for(var i=0;i<bs.length;i++)bs[i].onclick=function(){showStudy(this.getAttribute('data-id'),true);};
 handler=function(id){if(F[id].quiz)showStudy(id,false);else{$('info').innerHTML='<div class="big" style="color:#888">'+esc(nm(id))+'</div><p class="tl" style="text-align:center">Grey countries are neighbors. They are not on the quiz.</p>';clearCls();}};
}
function showStudy(id,fromList){
 clearCls();setCls(id,'sel');
 if(fromList&&F[id].small&&F[id].view&&DATA.views[F[id].view]&&VIEWNAME[F[id].view])setView(F[id].view);
 var f=F[id], g=DATA.groups[f.region];
 $('info').innerHTML='<div class="big">'+esc(f.name)+'</div>'+tilesHTML(f.name)+'<p class="tl" style="text-align:center">'+f.name.replace(/ /g,'').length+' letters. <span class="dot" style="background:'+g.color+'"></span>'+esc(g.name)+'</p><p class="tl">'+esc(f.hook)+'</p>';
 var bs=$('bottom').querySelectorAll('.names button');for(var i=0;i<bs.length;i++)bs[i].className=bs[i].getAttribute('data-id')===id?'on':'';
 if(fromList)$('mapbox').scrollIntoView({behavior:'smooth',block:'start'});
}

/* Rounds */
function startRound(mode,subset){
 setPaint('plain');labelsOn=false;setView('full');
 var ids=subset&&subset.length?subset:Q;
 R={mode:mode,queue:shuf(ids),total:ids.length,first:{},done:0,cur:null,lock:false};
 nextQ();
}
function nextQ(){
 clearCls();ringId=null;
 if(!R.queue.length)return endRound();
 R.cur=R.queue.shift();R.lock=false;
 if(R.mode==='find')askFind();else askName();
}
function counter(){var c=Object.keys(R.first).length;return '<span class="cnt">'+Math.min(c+1,R.total)+'/'+R.total+'</span>';}
function result(ok){
 var id=R.cur;
 if(!(id in R.first)){R.first[id]=ok;}
 mark(R.mode,id,ok);
 if(!ok)R.queue.splice(Math.min(R.queue.length,3),0,id); // comes back soon
}
function askFind(){
 setView('full');drawLabels();
 $('top').innerHTML='<div class="prompt"><div class="q"><small>Find it</small>Tap: '+esc(nm(R.cur))+'</div>'+counter()+'</div>';
 $('bottom').innerHTML='<p class="hint">Small country? Use a zoom button first, then tap.</p><div id="fb"></div>'+progressCard('find');
 handler=function(id){
  if(R.lock)return;
  if(!F[id].quiz&&false)return;
  R.lock=true;var ok=id===R.cur;result(ok);
  if(ok){setCls(id,'ok');$('fb').innerHTML='<div class="fb ok">\u2705 Yes! That is '+esc(nm(id))+'.</div>';setTimeout(nextQ,900);}
  else{
   setCls(id,'bad');setCls(R.cur,'ok');ringId=R.cur;
   var v=F[R.cur].view;if(F[R.cur].small&&VIEWNAME[v])setView(v);else drawLabels();
   $('fb').innerHTML='<div class="fb bad">You tapped <b>'+esc(nm(id))+'</b>'+(F[id].quiz?'':' (not on the quiz)')+'. <b>'+esc(nm(R.cur))+'</b> is the green one. It will come back.</div><div class="row"><button class="btn" id="nx">Next</button></div>';
   $('nx').onclick=nextQ;
  }
 };
}
function norm(s){s=String(s).normalize?String(s).normalize('NFD'):String(s);return s.replace(/[\u0300-\u036f]/g,'').toLowerCase().replace(/^\s*the\s+/,'').replace(/[^a-z]/g,'');}
function lev(a,b){var m=[],i,j;for(i=0;i<=a.length;i++){m[i]=[i];}for(j=0;j<=b.length;j++)m[0][j]=j;
 for(i=1;i<=a.length;i++)for(j=1;j<=b.length;j++)m[i][j]=Math.min(m[i-1][j]+1,m[i][j-1]+1,m[i-1][j-1]+(a[i-1]===b[j-1]?0:1));return m[a.length][b.length];}
function grade(id,input){
 var n=norm(input);if(!n)return {k:'empty'};
 var ok=[norm(F[id].name)].concat((ALIAS[id]||[]).map(norm));
 if(ok.indexOf(n)>=0)return {k:'ok'};
 for(var i=0;i<Q.length;i++){if(Q[i]!==id&&norm(F[Q[i]].name)===n)return {k:'other',other:Q[i]};}
 var d=Math.min.apply(null,ok.map(function(o){return lev(n,o);}));
 if(d<=Math.max(2,Math.floor(ok[0].length/4)))return {k:'close'};
 return {k:'wrong'};
}
window.__grade=grade;
function askName(){
 var f=F[R.cur];setCls(R.cur,'hl');ringId=f.small?R.cur:null;
 if(f.small&&VIEWNAME[f.view])setView(f.view);else setView('full');
 $('top').innerHTML='<div class="prompt"><div class="q"><small>Name it</small>Type the name of the pink country</div>'+counter()+'</div>';
 $('bottom').innerHTML='<form class="ans" id="af" autocomplete="off"><input id="inp" type="text" autocomplete="off" autocorrect="off" autocapitalize="words" spellcheck="false" placeholder="Country name" aria-label="Country name"><button class="btn g" type="submit">Check</button></form><div class="row"><button class="btn w" id="idk" type="button">Show me</button></div><div id="fb"></div>'+progressCard('name');
 handler=null;
 var inp=$('inp');
 if(window.matchMedia&&window.matchMedia('(pointer:fine)').matches)inp.focus();
 $('af').onsubmit=function(e){e.preventDefault();if(R.lock)return;var g=grade(R.cur,inp.value);if(g.k==='empty'){inp.focus();return;}answerName(g,inp.value);};
 $('idk').onclick=function(){if(R.lock)return;answerName({k:'idk'},'');};
}
function answerName(g,typed){
 R.lock=true;var id=R.cur,name=nm(id),ok=g.k==='ok';result(ok);
 $('inp').disabled=true;
 if(ok){setCls(id,'ok');$('fb').innerHTML='<div class="fb ok">\u2705 Correct! '+esc(name)+'</div>';setTimeout(nextQ,1000);return;}
 var msg;
 if(g.k==='close')msg='Close, but the spelling has to be exact. You typed <b>'+esc(typed)+'</b>.';
 else if(g.k==='other')msg='<b>'+esc(nm(g.other))+'</b> is a different country.';
 else if(g.k==='idk')msg='Here it is.';
 else msg='Not quite. You typed <b>'+esc(typed)+'</b>.';
 $('fb').innerHTML='<div class="fb bad">'+msg+' This country is:<div class="big">'+esc(name)+'</div>'+tilesHTML(name,'good')+'It will come back so you can try again.</div><div class="row"><button class="btn" id="nx">Next</button></div>';
 $('nx').onclick=nextQ;$('nx').focus();
}
function progressCard(mode){return '<div class="card">'+bar(mode==='find'?'Find it: locations I know':'Name it: spellings I know',known(mode))+'</div>';}
function endRound(){
 var ids=Object.keys(R.first),score=ids.filter(function(i){return R.first[i];}).length,miss=ids.filter(function(i){return !R.first[i];});
 if(R.total===22){var b=S.best[R.mode];if(b==null||score>b){S.best[R.mode]=score;save();}}
 handler=null;clearCls();setPaint('region');labelsOn=true;setView('full');
 $('top').innerHTML='<div class="card" style="text-align:center"><h2>Round done!</h2><div class="big">'+score+' / '+R.total+'</div><p class="tl">right on the first try</p>'+
 (miss.length?'<p class="tl"><b>Missed:</b></p><ul class="miss" style="text-align:left">'+miss.map(function(i){return '<li>'+esc(nm(i))+'</li>';}).join('')+'</ul>':'<p class="tl"><b>Perfect round!</b></p>')+
 '<div class="row" style="justify-content:center"><button class="btn" id="again">New round of all 22</button>'+(miss.length?'<button class="btn o" id="mo">Practice my misses</button>':'')+'</div></div>';
 var mode=R.mode;
 $('again').onclick=function(){startRound(mode);};
 if(miss.length)$('mo').onclick=function(){startRound(mode,miss);};
 $('bottom').innerHTML=progressCard(mode);
}
function missedScreen(){
 var mf=missed('find'),mn=missed('name');
 var h='<div class="card"><h2>Missed list</h2>';
 if(!mf.length&&!mn.length)h+='<p class="tl">Nothing missed right now. Play Find it or Name it, and any country you miss shows up here until you get it right.</p>';
 h+='<p class="tl"><b>Find it (locations): '+mf.length+'</b></p>'+(mf.length?'<ul class="miss">'+mf.map(function(i){return '<li>'+esc(nm(i))+'</li>';}).join('')+'</ul><div class="row"><button class="btn r" id="pf">Practice these in Find it</button></div>':'');
 h+='<p class="tl"><b>Name it (spelling): '+mn.length+'</b></p>'+(mn.length?'<ul class="miss">'+mn.map(function(i){return '<li>'+esc(nm(i))+'</li>';}).join('')+'</ul><div class="row"><button class="btn" id="pn" style="background:#7c4dff">Practice these in Name it</button></div>':'');
 $('top').innerHTML=h+'</div>'+'<div class="card">'+bar('Find it: locations I know',known('find'))+bar('Name it: spellings I know',known('name'))+'</div>';
 if(mf.length)$('pf').onclick=function(){go('find',mf);};
 if(mn.length)$('pn').onclick=function(){go('name',mn);};
}
function go(mode,subset){nav(mode);startRound(mode,subset);}

buildMap();
var zb=$('zoom').querySelectorAll('button');for(var i=0;i<zb.length;i++)zb[i].onclick=function(){setView(this.getAttribute('data-v'));};
var nb=$('nav').querySelectorAll('button');for(var j=0;j<nb.length;j++)nb[j].onclick=function(){nav(this.getAttribute('data-s'));};
window.__F=F;window.__views=DATA.views;
nav('home');
})();
</script>
