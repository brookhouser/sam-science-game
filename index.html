<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#5b3df5">
<title>7th Grade Science Lab Game</title>
<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0}
body{font-family:"Trebuchet MS","Segoe UI",system-ui,sans-serif;background:linear-gradient(160deg,#5b3df5 0%,#1fa2ff 55%,#12d8a4 100%);background-attachment:fixed;min-height:100vh;color:#1d1b3a}
#app{max-width:760px;margin:0 auto;padding:10px 12px 40px}
.top{display:flex;align-items:center;gap:10px;background:rgba(255,255,255,.95);border-radius:18px;padding:10px 12px;box-shadow:0 4px 0 rgba(0,0,0,.15)}
.top .logo{font-size:26px}
.top .who{flex:1;min-width:0}
.top .lvl{font-weight:800;font-size:15px}
.bar{height:12px;background:#e3e0ff;border-radius:8px;overflow:hidden;margin-top:4px}
.bar>i{display:block;height:100%;background:linear-gradient(90deg,#ff9f1c,#ff3d81);border-radius:8px;transition:width .4s}
.tbtn{border:0;background:#efeaff;border-radius:12px;padding:8px 10px;font-size:18px;cursor:pointer}
h1{color:#fff;text-align:center;margin:16px 0 4px;font-size:28px;text-shadow:0 3px 0 rgba(0,0,0,.2)}
.sub{color:#fff;text-align:center;margin:0 0 12px;font-weight:600}
.chips{display:flex;flex-wrap:wrap;gap:6px;justify-content:center;margin:8px 0 12px}
.chip{border:0;border-radius:20px;padding:8px 14px;font-weight:800;background:rgba(255,255,255,.35);color:#fff;cursor:pointer;font-size:14px}
.chip.on{background:#fff;color:#5b3df5;box-shadow:0 3px 0 rgba(0,0,0,.2)}
.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
@media(min-width:600px){.grid{grid-template-columns:repeat(3,1fr)}}
.mode{border:0;border-radius:20px;padding:14px 8px;color:#fff;font-weight:800;font-size:16px;cursor:pointer;box-shadow:0 5px 0 rgba(0,0,0,.22);text-align:center;min-height:104px;transition:transform .08s}
.mode:active{transform:translateY(3px);box-shadow:0 2px 0 rgba(0,0,0,.22)}
.mode .e{display:block;font-size:32px;margin-bottom:4px}
.mode small{display:block;font-weight:600;font-size:12px;opacity:.95;margin-top:2px}
.c1{background:#ff3d81}.c2{background:#ff9f1c}.c3{background:#7c4dff}.c4{background:#00b894}.c5{background:#0984e3}.c6{background:#e17055}.c7{background:#d63031}.c8{background:#6c5ce7}.c9{background:#00a8a8}
.card{background:#fff;border-radius:20px;padding:16px;margin:12px 0;box-shadow:0 5px 0 rgba(0,0,0,.15)}
.card h2{margin:0 0 8px;font-size:20px}
.row{display:flex;gap:8px;align-items:center;flex-wrap:wrap}
.stat{flex:1;min-width:90px;background:#f4f1ff;border-radius:14px;padding:8px;text-align:center}
.stat b{display:block;font-size:22px;color:#5b3df5}
.stat span{font-size:12px;font-weight:700}
.btn{border:0;border-radius:14px;padding:12px 18px;font-size:16px;font-weight:800;color:#fff;background:#5b3df5;cursor:pointer;box-shadow:0 4px 0 rgba(0,0,0,.2)}
.btn:active{transform:translateY(2px)}
.btn.g{background:#00b894}.btn.r{background:#ff3d81}.btn.o{background:#ff9f1c}.btn.w{background:#eee;color:#333}
.btn[disabled]{opacity:.45}
.hud{display:flex;gap:8px;align-items:center;color:#fff;font-weight:800;margin:10px 0}
.hud .sp{flex:1}
.hud .pill{background:rgba(0,0,0,.25);border-radius:14px;padding:6px 10px}
.q{font-size:20px;font-weight:800;line-height:1.3}
.q small{display:block;font-size:13px;color:#6b64a8;margin-bottom:4px}
.ch{display:block;width:100%;text-align:left;border:3px solid #e3e0ff;background:#fff;border-radius:14px;padding:12px;margin:8px 0;font-size:16px;font-weight:700;cursor:pointer;color:#1d1b3a}
.ch:active{background:#f4f1ff}
.ch.ok{background:#c9f7e2;border-color:#00b894}
.ch.bad{background:#ffd6e3;border-color:#ff3d81}
.ch[disabled]{cursor:default}
.fb{margin-top:10px;padding:10px;border-radius:12px;font-weight:700}
.fb.ok{background:#c9f7e2}.fb.bad{background:#ffe0e9}
.flash{perspective:900px;margin:12px 0}
.fc{min-height:230px;border-radius:22px;padding:20px;display:flex;align-items:center;justify-content:center;text-align:center;font-size:22px;font-weight:800;cursor:pointer;box-shadow:0 6px 0 rgba(0,0,0,.2);background:linear-gradient(135deg,#ffd166,#ff9f1c);color:#3a2300;animation:pop .25s}
.fc.back{background:linear-gradient(135deg,#a0f0d0,#00b894);color:#00332a;font-size:19px}
.fc small{display:block;font-size:13px;font-weight:700;margin-bottom:8px;opacity:.75}
@keyframes pop{from{transform:scale(.94);opacity:.5}to{transform:scale(1);opacity:1}}
.mgrid{display:grid;grid-template-columns:1fr 1.5fr;gap:8px}
.mt{border:3px solid #e3e0ff;background:#fff;border-radius:12px;padding:10px 8px;font-weight:800;font-size:14px;cursor:pointer;text-align:left;color:#1d1b3a}
.mt.sel{border-color:#7c4dff;background:#efeaff}
.mt.done{background:#c9f7e2;border-color:#00b894;opacity:.7}
.mt.wrong{animation:shake .35s;border-color:#ff3d81;background:#ffd6e3}
.mt.def{font-weight:600;font-size:13px}
@keyframes shake{25%{transform:translateX(-6px)}75%{transform:translateX(6px)}}
.steps{list-style:none;padding:0;margin:8px 0}
.steps li{background:#c9f7e2;border-radius:12px;padding:10px;margin:6px 0;font-weight:700}
.bank{display:flex;flex-direction:column;gap:6px}
.pill2{display:inline-block;background:#efeaff;border-radius:16px;padding:6px 12px;margin:3px;font-weight:700;font-size:14px}
.pill2.sel{background:#7c4dff;color:#fff}
.badges{display:grid;grid-template-columns:repeat(auto-fill,minmax(120px,1fr));gap:8px}
.badge{background:#f4f1ff;border-radius:14px;padding:8px;text-align:center;font-size:12px;font-weight:700;opacity:.4;filter:grayscale(1)}
.badge.on{opacity:1;filter:none;background:#fff3c4}
.badge b{display:block;font-size:26px}
.toast{position:fixed;left:50%;top:14px;transform:translateX(-50%);background:#1d1b3a;color:#fff;padding:10px 16px;border-radius:16px;font-weight:800;z-index:50;box-shadow:0 6px 20px rgba(0,0,0,.3);max-width:90%;text-align:center;animation:pop .25s}
.back{color:#fff;background:rgba(0,0,0,.25);border:0;border-radius:14px;padding:8px 12px;font-weight:800;cursor:pointer;font-size:15px}
label.chk{display:flex;gap:10px;align-items:flex-start;padding:8px 0;border-bottom:1px solid #eee;font-weight:600;cursor:pointer}
label.chk input{width:22px;height:22px;flex:none}
details{margin:6px 0}
summary{font-weight:800;cursor:pointer;padding:4px 0}
.tl{margin:4px 0 10px;font-size:14px}
.tl b{color:#5b3df5}
.hand{font-size:15px}
.big{font-size:44px;text-align:center}
.tag{font-size:11px;background:#efeaff;border-radius:8px;padding:2px 6px;margin-left:4px;color:#5b3df5;font-weight:800}
</style>
</head>

function flashcards(list,title){

function runMC(list,cfg){

   if(score>S.best.speed){S.best.speed=score;msg='New best score! ';}

  }else{xp=right*3;if(cfg.mode==='quiz'&&right===queue.length&&queue.length>=10)badge('perfect');}

  (miss.length?'<p><b>Missed:</b> '+miss.map(function(m){return esc(m);}).join('; ')+'</p><p class="tl">Missed items are saved in Missed Items mode.</p>':'<p>No misses. Amazing!</p>')+
  '<button class="btn g" id="again">Play again</button> <button class="btn w" id="hm">Home</button></div>');
  $('again').onclick=function(){go(cfg.mode==='review'?'review':cfg.mode);};$('hm').onclick=home;
 }

  var body='<div class="card"><div class="q"><small>'+esc(mc.hint)+'</small>'+esc(mc.text)+'</div><div id="chs">'+mc.choices.map(function(c,k){return '<button class="ch" data-k="'+k+'">'+esc(c.t)+'</button>';}).join('')+'</div><div id="fb"></div></div>';

 function draw(){
  var inner='<div class="hud"><div class="pill">Matched '+Object.keys(done).length+'/'+total+'</div><div class="sp"></div><div class="pill">Mistakes '+mist+'</div></div><div class="card"><div class="q"><small>Tap a word, then tap its meaning</small></div><div class="mgrid"><div class="bank">'+
  terms.map(function(p){return '<button class="mt'+(done[p.id]?' done':'')+(selT===p.id?' sel':'')+'" data-id="'+p.id+'" data-s="t">'+esc(p.term)+'</button>';}).join('')+'</div><div class="bank">'+
  defs.map(function(p){return '<button class="mt def'+(done[p.id]?' done':'')+(selD===p.id?' sel':'')+'" data-id="'+p.id+'" data-s="d">'+esc(p.def)+'</button>';}).join('')+'</div></div></div>';
  shell('Matching',inner);
  var bs=app.querySelectorAll('.mt');
  for(var i=0;i<bs.length;i++)bs[i].onclick=function(){
   var id=this.getAttribute('data-id'),side=this.getAttribute('data-s');
   if(done[id])return;
   if(side==='t')selT=(selT===id?null:id);else selD=(selD===id?null:id);
   if(selT&&selD){
    if(selT===selD){done[selT]=1;record(BYID[selT],!flagged[selT]);sOk();addXP(3);selT=selD=null;
     if(Object.keys(done).length===total)return finish();
    }else{mist++;sBad();var a=selT,b=selD;if(!flagged[a]){flagged[a]=1;record(BYID[a],false);}selT=selD=null;draw();
     var w=app.querySelectorAll('.mt');for(var k=0;k<w.length;k++){var wid=w[k].getAttribute('data-id');if(wid===a||wid===b)w[k].classList.add('wrong');}return;}
   }
   draw();
  };
 }
 function finish(){
  var xp=Math.max(10,30-mist*5);if(mist===0)badge('match');addXP(xp);
  var sc=Math.max(0,100-mist*15);if(sc>S.best.match)S.best.match=sc;save();sWin();
  shell('Matching','<div class="card"><div class="big">\uD83E\uDDE9</div><h2>All matched!</h2><div class="row"><div class="stat"><b>'+mist+'</b><span>Mistakes</span></div><div class="stat"><b>+'+xp+'</b><span>XP</span></div></div><p><button class="btn g" id="again">New round</button> <button class="btn w" id="hm">Home</button></p></div>');
  $('again').onclick=matching;$('hm').onclick=home;
 }
 draw();
}

/* ---------- order ---------- */
function runOrder(queue){
 var list=queue||shuf(filtered(['seq']).length?filtered(['seq']):ITEMS.filter(function(i){return i.kind==='seq';}));
 var idx=0,perfect=true,total=list.length;
 function one(){
  if(idx>=list.length){addXP(10);sWin();return shell('Put in Order','<div class="card"><div class="big">\uD83D\uDCCB</div><h2>All lists done!</h2><p>+10 XP</p><button class="btn g" id="again">Again</button> <button class="btn w" id="hm">Home</button></div>'),$('again').onclick=function(){runOrder();},$('hm').onclick=home;}
  var it=list[idx],order=shuf(it.steps.map(function(s,k){return k;})),n=0,mist=0;
  if(it.steps.length>1){var tries=0;while(order.join()===it.steps.map(function(s,k){return k;}).join()&&tries++<5)order=shuf(order);}
  function draw(){
   var doneList=it.steps.slice(0,n).map(function(s){return '<li>'+esc(s)+'</li>';}).join('');
   var bank=order.filter(function(k){return k>=n;}).map(function(k){return '<button class="ch" data-k="'+k+'">'+esc(it.steps[k])+'</button>';}).join('');
   shell('Put in Order','<div class="hud"><div class="pill">List '+(idx+1)+' of '+total+'</div><div class="sp"></div><div class="pill">Mistakes '+mist+'</div></div><div class="card"><div class="q"><small>Tap the steps in the right order, first to last</small>'+esc(it.title)+'</div><ol class="steps">'+doneList+'</ol><div>'+bank+'</div></div>');
   var bs=app.querySelectorAll('.ch');
   for(var b=0;b<bs.length;b++)bs[b].onclick=function(){
    var k=+this.getAttribute('data-k');
    if(k===n){n++;sOk();addXP(1);if(n===it.steps.length){record(it,mist===0);if(mist===0)badge('order');else perfect=false;idx++;return finishStep(it,mist);}}
    else{mist++;sBad();}
    draw();
   };
  }
  function finishStep(it,mist){
   shell('Put in Order','<div class="card"><h2>'+(mist===0?'\u2705 Perfect order!':'Done, with '+mist+' mistake'+(mist>1?'s':''))+'</h2><ol class="steps">'+it.steps.map(function(s){return '<li>'+esc(s)+'</li>';}).join('')+'</ol><button class="btn" id="nx">'+(idx>=list.length?'Finish':'Next list')+'</button></div>');
   $('nx').onclick=one;
  }
  draw();
 }
 one();
}

/* ---------- give me 5 ---------- */
function five(then){
 var it=BYID.five,chips=shuf(it.right.concat(it.decoys)),sel={},checked=false;
 function draw(){
  var n=Object.keys(sel).length;
  shell('Give Me 5','<div class="card"><div class="q"><small>Pick the 5 characteristics of living things (one for each finger)</small>Which 5 are true for ALL living things?</div><div style="margin:10px 0">'+chips.map(function(c,k){
    var cls='pill2'+(sel[c]?' sel':'');var st='';
    if(checked){if(it.right.indexOf(c)>=0){st='background:#c9f7e2;color:#004d3a;';}else if(sel[c]){st='background:#ffd6e3;color:#7a0030;';}}
    return '<button class="'+cls+'" style="border:0;cursor:pointer;font-size:15px;'+st+'" data-c="'+k+'">'+esc(c)+'</button>';}).join('')+'</div>'+
   (checked?'':'<button class="btn g" id="chk"'+(n===5?'':' disabled')+'>Check my '+n+'/5</button>')+
   '<div id="fb"></div></div>');
  if(checked)return;
  var bs=app.querySelectorAll('.pill2');
  for(var b=0;b<bs.length;b++)bs[b].onclick=function(){var c=chips[+this.getAttribute('data-c')];if(sel[c])delete sel[c];else if(Object.keys(sel).length<5)sel[c]=1;draw();};
  $('chk').onclick=function(){
   checked=true;var ok=it.right.every(function(r){return sel[r];})&&Object.keys(sel).length===5;
   record(it,ok);
   if(ok){badge('five');addXP(15);sWin();}else{sBad();}
   draw();
   $('fb').innerHTML='<div class="fb '+(ok?'ok':'bad')+'">'+(ok?'\u2705 Yes! +15 XP. ':'\u274C Not quite. ')+'The 5 are: '+it.right.map(esc).join(', ')+'.</div><p><button class="btn" id="again">Play again</button> <button class="btn w" id="hm">Home</button></p>';
   $('again').onclick=function(){five();};$('hm').onclick=home;
  };
 }
 draw();
}

/* ---------- review missed ---------- */
function review(){
 var m=missedItems();
 if(!m.length)return empty('Missed Items','You have no missed items right now. Play other modes and anything you miss will show up here.');
 var mc=m.filter(function(i){return i.kind==='pair'||i.kind==='fact'||i.kind==='sort';});
 var special=m.filter(function(i){return i.kind==='seq'||i.kind==='five';});
 var other=m.filter(function(i){return i.kind==='lookup';});
 if(mc.length)return runMC(shuf(mc),{title:'Missed Items ('+m.length+')',mode:'review',after:special});
 if(special.length){var sq=special.filter(function(i){return i.kind==='seq';});if(sq.length)return runOrder(sq);return five();}
 return flashcards(other,'Missed Items');
}

/* ---------- study guide ---------- */
function guide(){
 var byName={};PAIRS.forEach(function(p){byName[p.term.toLowerCase()]=p;});
 var vocab=VOCAB20.map(function(w){var p=byName[w.toLowerCase()];return '<details><summary>'+esc(w)+'</summary><div class="tl">'+(p?esc(p.def):'This word is on the vocabulary list, but its meaning is not given in the study materials. Look it up in your notebook or textbook.')+'</div></details>';}).join('');
 var groups={};SAM_GOALS.forEach(function(g,i){var id='g'+(i+1);(groups[g[1]]=groups[g[1]]||[]).push('<label class="chk"><input type="checkbox" data-g="'+id+'"'+(S.checks[id]?' checked':'')+'><span>'+esc(g[0])+'</span></label>');});
 var goalHtml=Object.keys(groups).map(function(k){return '<h3>'+esc(k)+'</h3>'+groups[k].join('');}).join('');
 var terms=SAM_TOPICS.map(function(t){
  var ps=PAIRS.filter(function(p){return p.topic===t.id;});
  return '<h3>'+t.emoji+' '+esc(t.name)+' ('+ps.length+' words)</h3>'+ps.map(function(p){return '<div class="tl"><b>'+esc(p.term)+':</b> '+esc(p.def)+'</div>';}).join('');}).join('');
 var facts=SAM_TOPICS.map(function(t){
  var fs=ITEMS.filter(function(f){return f.kind==='fact'&&f.topic===t.id;});
  return '<h3>'+t.emoji+' '+esc(t.name)+' facts ('+fs.length+')</h3>'+fs.map(function(f){return '<div class="tl"><b>'+esc(f.q)+'</b><br>'+esc(f.a)+'</div>';}).join('');}).join('');
 var seqs=SAM_SEQS.map(function(s){return '<h3>'+esc(s.title)+'</h3><ol>'+s.steps.map(function(x){return '<li class="tl">'+esc(x)+'</li>';}).join('')+'</ol>';}).join('');
 var sortH='<div class="tl"><b>Biotic (living):</b> '+SAM_SORT.filter(function(s){return s[1]==='biotic';}).map(function(s){return esc(s[0]);}).join(', ')+'<br><b>Abiotic (nonliving):</b> '+SAM_SORT.filter(function(s){return s[1]==='abiotic';}).map(function(s){return esc(s[0]);}).join(', ')+'</div>';
 var five='<ol>'+SAM_FIVE.right.map(function(x){return '<li class="tl">'+esc(x)+'</li>';}).join('')+'</ol>';
 shell('Study Guide','<div class="card"><h2>What is on the test</h2>'+goalHtml+'<p class="tl"><b>Not on this test:</b> '+esc(SAM_SKIPPED.text)+'</p></div>'+
 '<div class="card"><h2>The 20 vocabulary words</h2><p class="tl">Tap a word to see its meaning.</p>'+vocab+'</div>'+
 '<div class="card"><h2>5 characteristics of living things</h2>'+five+'</div>'+
 '<div class="card"><h2>Biotic or abiotic examples</h2>'+sortH+'</div>'+
 '<div class="card"><h2>Steps and orders</h2>'+seqs+'</div>'+
 '<div class="card"><details><summary>All words and meanings ('+PAIRS.length+')</summary>'+terms+'</details><details><summary>All facts ('+ITEMS.filter(function(f){return f.kind==='fact';}).length+')</summary>'+facts+'</details></div>'+
 '<div class="card"><h2>Study tips</h2><ul>'+SAM_TIPS.map(function(t){return '<li class="tl">'+esc(t)+'</li>';}).join('')+'</ul></div>');
 var cs=app.querySelectorAll('input[data-g]');
 for(var i=0;i<cs.length;i++)cs[i].onchange=function(){var id=this.getAttribute('data-g');if(this.checked)S.checks[id]=1;else delete S.checks[id];touchDay();checkMastery();save();};
}

/* ---------- boot + test hooks ---------- */
window.SamGame={items:ITEMS,makeMC:makeMC,state:function(){return S;},home:home,go:go,
 coverage:function(){
  var out={total:ITEMS.length,noPath:[]};
  ITEMS.forEach(function(it){
   var ok=false;
   if(it.kind==='pair'||it.kind==='fact'||it.kind==='sort')ok=!!makeMC(it);
   else ok=['seq','five','lookup','goal','skipped'].indexOf(it.kind)>=0;
   if(!ok)out.noPath.push(it.id);
  });
  return out;}};
home();
})();
</script>
